    e.target.click();
  }
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) closeModal();
  if (e.key === 'Escape' && $('#rulesdrawer').classList.contains('open')) closeRules();
});

function handleAction(action, node, c){
  switch (action){
    case 'new-char': {
      const nc = newCharacter('New character');
      state.characters.push(nc);
      state.activeId = nc.id;
      render(); save();
      toast('New character created.');
      break;
    }
    case 'settings': openSettings(); break;
    case 'open-profile': openProfile(); break;
    case 'pick-avatar': $('#avatarfile').click(); break;
    case 'remove-avatar': state.profile.avatar = ''; save(); cloud.pushProfile(); updateAccountChrome(); openProfile(); break;
    case 'save-username-guest': if (localRegister(val('profile-username'), val('profile-password'))) closeModal(); break;
    case 'save-username-local': renameLocalUsername(val('profile-username')); break;
    case 'save-username-cloud': renameCloudUsername(val('profile-username')); break;
    case 'go-social': switchTab('social'); break;
    case 'go-home': switchTab('home'); break;
    case 'rules': openRules(); break;
    case 'close-rules': closeRules(); break;
    case 'auth-signin': localSignIn(val('auth-username'), val('auth-password')); break;
    case 'auth-register': localRegister(val('auth-username'), val('auth-password')); break;
    case 'auth-guest': continueAsGuest(); break;
    case 'cloud-signin': cloud.signIn(val('cloud-email'), val('cloud-password')); break;
    case 'cloud-signup': cloud.signUp(val('cloud-email'), val('cloud-password')); break;
    case 'toggle-password': {
      const input = document.getElementById(node.dataset.target);
      if (input){
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        node.classList.toggle('on', !showing);
        node.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      }
      break;
    }
    case 'sign-out-session': signOutSession(); break;
    case 'open-char': state.activeId = node.dataset.cid; switchTab('front'); break;
    case 'new-char-home': {
      const nc = newCharacter('New character');
      state.characters.push(nc);
      state.activeId = nc.id;
      switchTab('front');
      break;
    }
    case 'delete-char-home': deleteCharacterById(node.dataset.cid); break;
    case 'duplicate-char-home': {
      const src = state.characters.find(x => x.id === node.dataset.cid);
      if (src){
        const copy = JSON.parse(JSON.stringify(src));
        copy.id = uid(); copy.name = src.name + ' (copy)'; copy.updatedAt = Date.now(); copy.pinned = false; copy.partyId = null;
        state.characters.push(copy);
        renderHomeTab(); save();
        toast(`Duplicated ${src.name}.`);
      }
      break;
    }
    case 'toggle-pin': {
      const target = state.characters.find(x => x.id === node.dataset.cid);
      if (target){ target.pinned = !target.pinned; target.updatedAt = Date.now(); renderHomeTab(); save(); }
      break;
    }
    case 'copy-code': {
      const code = node.dataset.code;
      if (!code) break;
      const done = () => toast('Join code copied.');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done).catch(() => toast(code));
      else toast(code);
      break;
    }
    case 'open-campaign': {
      state.activePartyId = node.dataset.pid;
      switchTab('social');
      break;
    }
    case 'create-campaign-home': createCampaignHome(val('homecampaignname')); break;
    case 'join-campaign-home': joinCampaignHome(val('joincode')); break;
    case 'short-rest': shortRest(); break;
    case 'long-rest': longRest(); break;
    case 'export': openExportModal(c); break;
    case 'export-json': exportCharacter(c); closeModal(); break;
    case 'export-pdf': preparePrintSheet(); closeModal(); setTimeout(() => window.print(), 150); break;
    case 'export-both': exportCharacter(c); preparePrintSheet(); closeModal(); setTimeout(() => window.print(), 150); break;
    case 'export-all': exportAll(); break;
    case 'import': $('#filein').click(); break;
    case 'add-weapon':
      c.weapons.push({name:'', skill:'lightWeapons', bonus:0, damage:'1d6', traits:'', defense:'physical', handKey:true});
      renderFront(); save(); break;
    case 'add-weapon-catalog': {
      const wname = weaponPick.weapon;
      const cat = GAME_DATABASE.weapons[wname];
      if (cat){
        c.weapons.push({
          name: wname, skill: GAME_SKILL_KEY[cat.skill] || 'lightWeapons', bonus:0,
          damage: cat.damage, traits: cat.traits === 'None' ? '' : cat.traits,
          defense:'physical', catalogName: wname, handKey:false
        });
      }
      weaponPick = {category:'', weapon:''};
      renderFront(); save(); break;
    }
    case 'del-weapon':
      c.weapons.splice(parseInt(node.dataset.i, 10), 1);
      renderFront(); save(); break;
    case 'toggle-weapon-thrown': {
      const w = c.weapons[parseInt(node.dataset.i, 10)];
      if (!w) break;
      w.thrownUsed = !w.thrownUsed;
      node.setAttribute('aria-pressed', String(!!w.thrownUsed));
      node.textContent = `Thrown: ${w.thrownUsed ? 'Used' : 'In hand'}`;
      save();
      break;
    }
    case 'cycle-turn-speed': {
      const mode = TURN_SPEED_ORDER[(TURN_SPEED_ORDER.indexOf(c.turnSpeed || 'passive') + 1) % TURN_SPEED_ORDER.length];
      c.turnSpeed = mode;
      $$('[data-action="cycle-turn-speed"]').forEach(btn => {
        btn.className = `turnspeed turnspeed-${mode}`;
        btn.innerHTML = turnSpeedIconHTML(mode);
        btn.title = `${TURN_SPEED_LABEL[mode]} — click to cycle`;
        btn.setAttribute('aria-label', `Turn speed: ${TURN_SPEED_LABEL[mode]}`);
      });
      save();
      break;
    }
    case 'roll-weapon-hit': rollWeaponAction(parseInt(node.dataset.i, 10), 'hit'); break;
    case 'roll-weapon-graze': rollWeaponAction(parseInt(node.dataset.i, 10), 'graze'); break;
    case 'roll-weapon-crit': rollWeaponAction(parseInt(node.dataset.i, 10), 'crit'); break;
    case 'show-weapon-info': openWeaponModal(c, parseInt(node.dataset.i, 10)); break;
    case 'show-armor-info': openArmorModal(c); break;
    case 'show-cond-info': openConditionModal(node.dataset.condName); break;
    case 'add-injury': c.injuries.push({text:'', days:1}); renderFront(); save(); break;
    case 'del-injury': c.injuries.splice(parseInt(node.dataset.i, 10), 1); renderFront(); save(); break;
    case 'add-squire': c.squires.push({name:'', type:'Squire', notes:''}); renderFront(); save(); break;
    case 'del-squire': c.squires.splice(parseInt(node.dataset.i, 10), 1); renderFront(); save(); break;
    case 'add-fabrial': c.fabrials.push({name:'', type:'', maxCharge:10, charge:10, weight:0, notes:''}); renderBack(); save(); break;
    case 'add-fabrial-catalog': {
      const itemName = fabrialPick.item;
      const source = fabrialPick.category === 'Unique / Crafted' ? GAME_ITEMS_DATABASE.uniqueFabrialEffects : GAME_ITEMS_DATABASE.standardFabrials;
      const item = itemName ? source[itemName] : null;
      if (item){
        const maxCharge = typeof item.charges === 'number' ? item.charges : 0;
        c.fabrials.push({
          name: itemName, type: fabrialPick.category, maxCharge, charge: maxCharge,
          weight: item.weight, notes: item.description + (typeof item.charges !== 'number' ? ` (${item.charges} charges)` : '')
        });
      }
      fabrialPick = {category:'', item:''};
      renderBack(); syncDerived(); save();
      break;
    }
    case 'show-fabrial-info': openFabrialModal(c, parseInt(node.dataset.i, 10)); break;
    case 'add-note': {
      const titleInput = $('#newNoteTitle');
      const title = titleInput ? titleInput.value.trim() : '';
      if (!title) break;
      const note = {id:uid(), title, text:'', updatedAt:Date.now()};
      c.notebook = c.notebook || [];
      c.notebook.unshift(note);
      noteEditing = note.id;
      renderBack(); save();
      openNoteModal(c, note.id);
      break;
    }
    case 'open-note': noteEditing = null; openNoteModal(c, node.dataset.id); break;
    case 'toggle-note-edit': {
      const id = node.dataset.id;
      const note = (c.notebook || []).find(n => n.id === id);
      if (!note) break;
      if (noteEditing === id){
        const titleEl = $('#noteTitleInput'), textEl = $('#noteTextInput');
        note.title = titleEl && titleEl.value.trim() ? titleEl.value.trim() : note.title;
        note.text = textEl ? textEl.value : note.text;
        note.updatedAt = Date.now();
        noteEditing = null;
        renderBack(); save();
      } else {
        noteEditing = id;
      }
      openNoteModal(c, id);
      break;
    }
    case 'delete-note': {
      const id = node.dataset.id;
      const note = (c.notebook || []).find(n => n.id === id);
      confirmDialog(`Delete "${esc(note ? note.title : 'this note')}"? This cannot be undone.`, () => {
        c.notebook = (c.notebook || []).filter(n => n.id !== id);
        noteEditing = null;
        renderBack(); save();
      }, {okLabel:'Delete note'});
      break;
    }
    case 'del-fabrial': c.fabrials.splice(parseInt(node.dataset.i, 10), 1); renderBack(); save(); break;
    case 'add-gear-catalog': {
      const itemName = gearPick.item;
      const item = itemName ? GAME_ITEMS_DATABASE.equipment[itemName] : null;
      if (item){
        c.gear = c.gear || [];
        c.gear.push({name:itemName, category:item.category, weight:item.weight, price:item.price, qty:1, desc:item.description, custom:false});
      }
      gearPick = {category:'', item:''};
      renderBack(); syncDerived(); save();
      break;
    }
    case 'add-gear-custom': openCustomGearModal(); break;
    case 'add-gear-custom-submit': {
      const name = val('gcName').trim();
      if (name){
        c.gear = c.gear || [];
        c.gear.push({
          name, category: val('gcCategory').trim() || 'Custom',
          weight: parseFloat(val('gcWeight')) || 0, price: parseFloat(val('gcPrice')) || 0,
          qty: parseInt(val('gcQty'), 10) || 1, desc: val('gcDesc').trim(), custom:true
        });
      }
      closeModal(); renderBack(); syncDerived(); save();
      break;
    }
    case 'del-gear': (c.gear || []).splice(parseInt(node.dataset.i, 10), 1); renderBack(); syncDerived(); save(); break;
    case 'show-gear-info': openGearModal(c, parseInt(node.dataset.i, 10)); break;
    case 'del-expertise': c.expertises.splice(parseInt(node.dataset.i, 10), 1); renderFront(); syncDerived(); save(); break;
    case 'toggle-expertise-temp': {
      const e = c.expertises[parseInt(node.dataset.i, 10)];
      if (!e) break;
      e.temporary = !e.temporary;
      node.classList.toggle('temporary', e.temporary);
      node.title = e.temporary ? 'Temporary — click to make regular' : 'Regular — click to mark temporary';
      const kindEl = node.querySelector('.kind');
      if (kindEl) kindEl.textContent = expertisePillLabel(e);
      save();
      break;
    }
    case 'add-talent': {
      if (talentPick.talent && !(c.talentIds || []).includes(talentPick.talent)){
        c.talentIds.push(talentPick.talent);
      }
      talentPick.talent = '';
      renderFront(); syncDerived(); save();
      break;
    }
    case 'del-talent': c.talentIds.splice(parseInt(node.dataset.i, 10), 1); renderFront(); syncDerived(); save(); break;
    case 'show-talent-info': openTalentModal(node.dataset.talent); break;
    case 'add-goal': c.goals.push({text:'', ticks:[false,false,false]}); renderBack(); save(); break;
    case 'del-goal': c.goals.splice(parseInt(node.dataset.i, 10), 1); renderBack(); save(); break;
    case 'toggle-tray': {
      const tray = $('#tray');
      tray.classList.toggle('collapsed');
      $('#traytoggle').textContent = tray.classList.contains('collapsed') ? 'Show' : 'Hide';
      break;
    }
    case 'clear-log': state.rolls = []; renderRolls(); save(); break;
    case 'plot-only': { if (state.settings.diceMode !== 'enabled') break; const p = plotDie(); logRoll({what:'Plot die', total:String(p.value), detail:p.label, plot:p}); break; }
    case 'clear-sheet': {
      confirmDialog('Clear every field on this character? This cannot be undone.', () => {
        const keep = c.id;
        const fresh = newCharacter('Unnamed Radiant');
        fresh.id = keep;
        state.characters = state.characters.map(x => x.id === keep ? fresh : x);
        render(); save();
        toast('Sheet cleared.');
      }, {okLabel:'Clear sheet'});
      break;
    }
    case 'reset-level': {
      c.level = 1;
      const d = derive(c);
      c.health.current = d.maxHealth; c.focus.current = d.maxFocus;
      closeModal(); render(); save();
      toast('Back to level 1.');
      break;
    }
    case 'delete-char': {
      confirmDialog(`Delete ${esc(c.name)}?`, () => {
        removeCharacter(c.id);
        if (state.characters.length) render(); else switchTab('home');
        save();
      });
      break;
    }
    case 'duplicate-char': {
      const copy = JSON.parse(JSON.stringify(c));
      copy.id = uid(); copy.name = c.name + ' (copy)'; copy.updatedAt = Date.now();
      state.characters.push(copy); state.activeId = copy.id;
      closeModal(); render(); save();
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'confirm-ok': { const fn = pendingConfirm; pendingConfirm = null; closeModal(); if (fn) fn(); break; }
    case 'confirm-cancel': pendingConfirm = null; closeModal(); break;
    default: handleSocialAction(action, node, c);
  }
}

$('#charpick').addEventListener('change', e => {
  state.activeId = e.target.value;
  render(); save();
});

/* ---------- import / export ---------- */
function download(filename, data){
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = s => (s || 'character').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function exportCharacter(c){ download(`${slug(c.name)}.json`, JSON.stringify({type:'radiant-sheet-character', character:c}, null, 2)); toast('Character file downloaded.'); }

/* ---------- printed sheet — mirrors the official two-page Cosmere RPG character sheet ---------- */
function pipsPlain(n, max){
  n = Math.max(0, Math.min(max, n|0));
  return '●'.repeat(n) + '○'.repeat(max - n);
}

function printAttrGroupHTML(c, d, realm){
  const [a1, a2] = realm.attrs;
  const defKey = {physical:'physicalDefense', cognitive:'cognitiveDefense', spiritual:'spiritualDefense'}[realm.key];
  return `<div class="attrgroup">
    <div class="glabel">${esc(realm.name)}</div>
    <div class="three">
      <div class="abox"><span class="lbl">${ATTRS[a1].name}</span><span class="val">${c.attributes[a1]}</span></div>
      <div class="pshield"><span class="lbl">Defense</span><span class="val">${d[defKey]}</span></div>
      <div class="abox"><span class="lbl">${ATTRS[a2].name}</span><span class="val">${c.attributes[a2]}</span></div>
    </div>
  </div>`;
}

function printSkillColHTML(c, d, realm){
  const rows = realm.skills.map(([key, name, attr]) => `<div class="srow">
      <span class="box"></span><span class="nm">${esc(name)} (${ATTRS[attr].short})</span><span class="pips">${pipsPlain(c.skills[key].ranks, 5)}</span>
    </div>`).join('');
  const customKey = 'custom_' + realm.key;
  const custom = c.skills[customKey];
  const customRow = `<div class="srow">
      <span class="box"></span><span class="nm">${esc(custom.name) || '________________'} (${ATTRS[custom.attr].short})</span><span class="pips">${pipsPlain(custom.ranks, 5)}</span>
    </div>`;
  return `<div class="skillcol">${rows}${customRow}</div>`;
}

function printHeaderHTML(title, subtitle, c){
  return `<div class="stop">
    <div class="stitle">
      <svg class="glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 1.5 15 9l7.5 3-7.5 3-3 7.5-3-7.5L1.5 12 9 9z" fill="#333"/>
        <circle cx="12" cy="12" r="10.2" stroke="#333" stroke-opacity=".5" fill="none"/>
      </svg>
      <div><h1>${esc(title)}</h1><h2>${esc(subtitle)}</h2></div>
    </div>
    <div class="sidbox">
      <div class="sbox"><span class="lbl">Character name</span><span class="val">${esc(c.name)}</span></div>
      <div class="sbox"><span class="lbl">Level</span><span class="val">${c.level}</span></div>
      <div class="sbox"><span class="lbl">Paths</span><span class="val">${esc(c.paths)}</span></div>
      <div class="sbox"><span class="lbl">Ancestry</span><span class="val">${esc(c.ancestry)}</span></div>
    </div>
  </div>
  <div class="sbox" style="margin-bottom:.4rem"><span class="lbl">Player name</span><span class="val">${esc(c.playerName)}</span></div>`;
}

function buildPrintSheetHTML(c, d){
  const expertiseList = (c.expertises || []).map(e => `${esc(e.name)}${e.temporary ? ' (temp)' : ''}`).join(', ') || '—';
  const conditionsOn = CONDITIONS.filter(n => c.conditions[n]).join(', ') || 'None';
  const injuriesText = (c.injuries || []).filter(i => i.text).map(i => `${esc(i.text)} (${i.days}d)`).join('; ') || 'None';
  const weaponsText = (c.weapons || []).map(w => {
    const disp = weaponDisplay(c, d, w);
    const nm = w.name || (disp.catalog ? w.catalogName : 'Weapon');
    return `<div class="item-line"><b>${esc(nm)}</b> — Attack ${sgn(disp.attackMod)}, Damage ${esc(disp.diceExpr)} ${sgn(disp.totalDamageMod)} ${esc(disp.damageType)}</div>`;
  }).join('') || '<div class="item-line">None</div>';
  const talentNames = (c.talentIds || []).length ? c.talentIds.join(', ') : (c.talents || '—');
  const gearText = (c.gear || []).map(g => `<div class="item-line">${esc(g.name)}${g.qty > 1 ? ` ×${g.qty}` : ''} — ${g.weight} lbs, ${g.price} Marks</div>`).join('') || '<div class="item-line">None</div>';
  const fabrialText = (c.fabrials || []).map(f => `<div class="item-line">${esc(f.name)} — Charge ${f.charge}/${f.maxCharge}${f.weight ? `, ${f.weight} lbs` : ''}</div>`).join('');
  const goalsText = (c.goals || []).filter(g => g.text).map(g => `<div class="goal-line"><span>${esc(g.text)}</span><span>${pipsPlain(g.ticks.filter(Boolean).length, 3)}</span></div>`).join('') || '<div class="goal-line"><span>None</span></div>';

  const page1 = `<div class="sheet-page">
    ${printHeaderHTML('Cosmere Roleplaying Game', '', c)}
    <div class="attrrow">${REALMS.map(r => printAttrGroupHTML(c, d, r)).join('')}</div>
    <div class="poolrow">
      <div class="poolbox"><span class="lbl">Health</span><span class="val">${c.health.current} / ${d.maxHealth}</span></div>
      <div class="poolbox"><span class="lbl">Focus</span><span class="val">${c.focus.current} / ${d.maxFocus}</span></div>
      <div class="poolbox"><span class="lbl">Investiture</span><span class="val">${c.investiture.current} / ${d.maxInvestiture}</span></div>
    </div>
    <div class="poolrow"><div class="poolbox"><span class="lbl">Deflect</span><span class="val">${d.deflect}</span></div></div>
    <div class="skillcols">${REALMS.map(r => printSkillColHTML(c, d, r)).join('')}</div>
    <div class="rangerow">
      <div class="sbox"><span class="lbl">Lifting capacity</span><span class="val">${d.lifting}</span></div>
      <div class="sbox"><span class="lbl">Movement</span><span class="val">${d.movement}</span></div>
      <div class="sbox"><span class="lbl">Recovery die</span><span class="val">${d.recovery}</span></div>
      <div class="sbox"><span class="lbl">Senses range</span><span class="val">${d.senses}</span></div>
    </div>
    <div class="twinrow">
      <div class="textbox"><span class="lbl">Conditions &amp; injuries</span><div class="body">${esc(conditionsOn)}${injuriesText !== 'None' ? '<br>' + injuriesText : ''}</div></div>
      <div class="textbox"><span class="lbl">Expertises</span><div class="body">${expertiseList}</div></div>
    </div>
    <div class="twinrow">
      <div class="textbox"><span class="lbl">Weapons</span><div class="body">${weaponsText}</div></div>
      <div class="textbox"><span class="lbl">Talents</span><div class="body">${esc(talentNames)}</div></div>
    </div>
    <div class="page-footer">Cosmere RPG Character Sheet · Radiant Sheet export</div>
  </div>`;

  const page2 = `<div class="sheet-page">
    ${printHeaderHTML(c.campaign || 'Campaign Setting', 'Campaign Setting', c)}
    <div class="attrrow">${REALMS.map(r => printAttrGroupHTML(c, d, r)).join('')}</div>
    <div class="threecol">
      <div class="textbox" style="min-height:16rem"><span class="lbl">Character appearance</span><div class="body">${esc(c.appearance) || '—'}</div></div>
      <div class="textbox" style="min-height:16rem"><span class="lbl">Armor &amp; equipment</span><div class="body">
        <div class="item-line"><b>${esc(d.armor.name)}</b> — Deflect ${d.armor.deflect}</div>
        ${gearText}${fabrialText}
        ${esc(c.equipment) ? `<div class="item-line">${esc(c.equipment)}</div>` : ''}
        <div class="item-line" style="margin-top:.3rem"><b>Spheres</b> — ${c.spheres.chips||0} chips, ${c.spheres.marks||0} marks, ${c.spheres.broams||0} broams</div>
      </div></div>
      <div class="textbox" style="min-height:16rem">
        <span class="lbl">Purpose</span><div class="body" style="margin-bottom:.3rem">${esc(c.purpose) || '—'}</div>
        <span class="lbl">Obstacle</span><div class="body" style="margin-bottom:.3rem">${esc(c.obstacle) || '—'}</div>
        <span class="lbl">Goals</span><div class="body">${goalsText}</div>
      </div>
    </div>
    <div class="threecol" style="margin-top:.3rem">
      <div class="textbox"><span class="lbl">Talents, continued</span><div class="body">${(c.talentIds || []).length > 8 ? esc(c.talentIds.slice(8).join(', ')) : '—'}</div></div>
      <div class="textbox"><span class="lbl">Notes</span><div class="body">${esc(c.notes) || '—'}</div></div>
      <div class="textbox"><span class="lbl">Connections</span><div class="body">${esc(c.connections) || '—'}</div></div>
    </div>
    <div class="page-footer">Cosmere RPG Character Sheet · Radiant Sheet export</div>
  </div>`;

  return page1 + page2;
}

function preparePrintSheet(){
  const c = activeChar();
  if (!c) return;
  const d = derive(c);
  const el = $('#printSheet');
  if (el) el.innerHTML = buildPrintSheetHTML(c, d);
}

function openExportModal(c){
  if (!c) return;
  openModal(`
    <h2>Export ${esc(c.name || 'character')}</h2><hr class="rule">
    <p class="hint" style="margin-bottom:1rem">Choose how to save this character sheet.</p>
    <div style="display:flex;flex-direction:column;gap:.9rem">
      <div>
        <button class="btn" style="width:100%" data-action="export-json">Download JSON</button>
        <p class="hint" style="margin-top:.3rem">For backing up or re-importing into Radiant Sheet later.</p>
      </div>

function renderRulesDrawer(q){
  q = (q || '').trim().toLowerCase();
  const body = $('#rulesbody');
  if (!body) return;
  const match = x => !q || x.name.toLowerCase().includes(q) || (x.desc || '').toLowerCase().includes(q);
  const sections = [];
  const skillItems = ALL_SKILLS.map(s => ({name:s.name, sub:ATTRS[s.attr].short, desc:SKILL_BLURBS[s.key] || ''})).filter(match);
  if (skillItems.length) sections.push(ruleSection('Skills', skillItems));
  const actionItems = COMBAT_ACTIONS.filter(match);
  if (actionItems.length) sections.push(ruleSection('Combat actions', actionItems));
  const condItems = CONDITIONS.map(n => ({name:n, desc:CONDITION_BLURBS[n] || ''})).filter(match);
  if (condItems.length) sections.push(ruleSection('Conditions', condItems));
  const surgeItems = SURGE_BLURBS.filter(match);
  if (surgeItems.length) sections.push(ruleSection('Surges', surgeItems));
  body.innerHTML = sections.join('') || '<p class="empty">No matches for that search.</p>';
}

/* ---------- character removal with undo ---------- */
let lastDeletedChar = null;
function removeCharacter(id){
  const idx = state.characters.findIndex(x => x.id === id);
  if (idx === -1) return;
  const [removed] = state.characters.splice(idx, 1);
  if (state.activeId === id) state.activeId = state.characters[0] ? state.characters[0].id : null;
  cloud.pendingDeletes.add(id);
  lastDeletedChar = removed;
  const label = removed.name || 'Character';
  showUndoToast(`${label} deleted.`, () => {
    if (lastDeletedChar !== removed) return;
    cloud.pendingDeletes.delete(id);
    removed.updatedAt = Date.now();
    state.characters.push(removed);
    if (!state.activeId) state.activeId = removed.id;
    lastDeletedChar = null;
    render(); save();
    toast('Restored.');
  });
}

/* ============================================================
   CLOUD — optional Firebase sync
   ============================================================ */
const cloud = {
  on:false, ready:false, app:null, auth:null, db:null, user:null,
  me:{username:'', friends:[], parties:[]}, requests:[], friendProfiles:[], parties:[],
  unsubs:[], lastPatchAt:0, pushTimer:null,
  lastPushedAt:{}, knownRemoteIds:new Set(), charPushTimer:null, attempted:false, pendingDeletes:new Set(),

  async connect(){
    const cfg = state.settings.firebase;
    if (!cfg.apiKey || !cfg.projectId) return false;
    this.attempted = true;
    try {
      const [appMod, authMod, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      ]);
      this.fb = {...authMod, ...fsMod};
      try { this.app = appMod.initializeApp(cfg, 'radiant-sheet'); }
      catch(e){ this.app = appMod.getApp('radiant-sheet'); }
      this.auth = authMod.getAuth(this.app);
      this.db = fsMod.getFirestore(this.app);
      this.on = true;
      let settled = false;
      await new Promise(resolveFirst => {
        authMod.onAuthStateChanged(this.auth, user => {
          this.user = user;
          if (user){
            if (!state.session || state.session.mode !== 'cloud') state.session = {mode:'cloud'};
            this.listen();
            if (settled && state.view === 'auth'){ state.tab = 'home'; switchView('main'); }
          } else {
            this.stopListening();
            if (state.session && state.session.mode === 'cloud'){
              state.session = null;
              if (settled && state.view === 'main') switchView('auth');
            }
          }
          renderSocial();
          updateAccountChrome();
          setSavePill('saved');
          if (!settled){ settled = true; resolveFirst(); }
        });
      });
      return true;
    } catch(err){
      console.error(err);
      this.on = false;
      if (state.view === 'auth') renderAuth(); else toast('Could not reach Firebase. Check the keys and your connection.');
      return false;
    }
  },

  async signUp(email, pw){
    try {
      await this.fb.createUserWithEmailAndPassword(this.auth, email, pw);
      toast('Account created. Pick a username next.');
    } catch(err){ toast(this.readable(err)); }
  },
  async signIn(email, pw){
    try { await this.fb.signInWithEmailAndPassword(this.auth, email, pw); }
    catch(err){ toast(this.readable(err)); }
  },
  async signOut(){ await this.fb.signOut(this.auth); this.me = {username:'', friends:[], parties:[]}; renderSocial(); },

  readable(err){
    const code = (err && err.code || '').replace('auth/', '');
    return {
      'invalid-email':'That email address is not valid.',
      'missing-password':'Enter a password.',
      'weak-password':'Use at least six characters for the password.',
      'email-already-in-use':'That email already has an account — sign in instead.',
      'invalid-credential':'Email or password did not match.',
      'operation-not-allowed':'Turn on email sign-in in your Firebase console.'
    }[code] || (err && err.message) || 'Something went wrong.';
  },

  doc(...p){ return this.fb.doc(this.db, ...p); },

  listen(){
    this.stopListening();
    const uidv = this.user.uid;
    this.unsubs.push(this.fb.onSnapshot(this.doc('users', uidv), snap => {
      this.me = Object.assign({username:'', friends:[], parties:[]}, snap.data() || {});
      if (this.me.avatar !== undefined && this.me.avatar !== state.profile.avatar){
        state.profile.avatar = this.me.avatar;
        this.lastPushedAvatar = this.me.avatar;
        persistLocal();
      }
      this.loadFriendProfiles();
      this.watchParties();
      renderSocial();
      updateAccountChrome();
    }));
    this.unsubs.push(this.fb.onSnapshot(this.fb.collection(this.db, 'users', uidv, 'requests'), snap => {
      this.requests = snap.docs.map(d => ({id:d.id, ...d.data()}));
      renderSocial();
      updateAccountChrome();
    }));
    this.listenCharacters();
    this.syncCharactersUp();
  },

  stopListening(){
    this.unsubs.forEach(u => { try{ u(); }catch(e){} });
    this.unsubs = []; this.partyUnsubs = [];
    this.lastPushedAt = {}; this.knownRemoteIds = new Set(); this.lastPushedAvatar = undefined; this.pendingDeletes = new Set();
  },

  listenCharacters(){
    const uidv = this.user.uid;
    this.unsubs.push(this.fb.onSnapshot(this.fb.collection(this.db, 'users', uidv, 'characters'), snap => {
      let changed = false;
      const remoteIds = new Set();
      snap.forEach(docSnap => {
        remoteIds.add(docSnap.id);
        this.knownRemoteIds.add(docSnap.id);
        if (this.pendingDeletes.has(docSnap.id)) return; // we're deleting this locally — don't resurrect it
        const remote = docSnap.data();
        const local = state.characters.find(c => c.id === docSnap.id);
        if (!local){
          migrate(remote);
          state.characters.push(remote);
          this.lastPushedAt[docSnap.id] = remote.updatedAt || 0;
          changed = true;
        } else if ((remote.updatedAt || 0) > (local.updatedAt || 0)){
          Object.assign(local, remote);
          this.lastPushedAt[docSnap.id] = remote.updatedAt || 0;
          changed = true;
        }
      });
      if (remoteIds.size){
        const blanks = state.characters.filter(c =>
          !remoteIds.has(c.id) && this.lastPushedAt[c.id] === undefined && isBlankDefaultChar(c));
        if (blanks.length && state.characters.length - blanks.length > 0){
          state.characters = state.characters.filter(c => !blanks.includes(c));
          changed = true;
        }
      }
      if (state.characters.length && !state.characters.some(c => c.id === state.activeId)) state.activeId = state.characters[0].id;
      if (changed){ persistLocal(); if (state.view === 'main') render(); }
    }));
  },

  pushProfile(){
    if (!this.on || !this.user) return;
    if (this.lastPushedAvatar === state.profile.avatar) return;
    const uidv = this.user.uid;
    const avatar = state.profile.avatar;
    this.fb.setDoc(this.doc('users', uidv), {avatar}, {merge:true})
      .then(() => { this.lastPushedAvatar = avatar; })
      .catch(() => {});
  },

  syncCharactersUp(){
    if (!this.on || !this.user) return;
    clearTimeout(this.charPushTimer);
    this.charPushTimer = setTimeout(async () => {
      const uidv = this.user.uid;
      if (!uidv) return;
      for (const c of state.characters){
        const stamp = c.updatedAt || 0;
        if (this.lastPushedAt[c.id] === stamp) continue;
        try {
          await this.fb.setDoc(this.doc('users', uidv, 'characters', c.id), c);
          this.lastPushedAt[c.id] = stamp;
          this.knownRemoteIds.add(c.id);
        } catch(e){ /* offline is fine — retries on next edit */ }
      }
      for (const id of Array.from(this.knownRemoteIds)){
        if (!state.characters.some(c => c.id === id)){
          try { await this.fb.deleteDoc(this.doc('users', uidv, 'characters', id)); } catch(e){}
          this.knownRemoteIds.delete(id);
          delete this.lastPushedAt[id];
          this.pendingDeletes.delete(id);
        }
      }
    }, 150);
  },

  async loadFriendProfiles(){
    const out = [];
    for (const fid of (this.me.friends || [])){
      try {
        const s = await this.fb.getDoc(this.doc('users', fid));
        if (s.exists()) out.push({uid:fid, username:s.data().username});
      } catch(e){}
    }
    this.friendProfiles = out;
    renderSocial();
  },

  watchParties(){
    (this.me.parties || []).forEach(pid => {
      if (this.parties.some(p => p.id === pid && p._watching)) return;
      const unsub = this.fb.onSnapshot(this.doc('parties', pid), snap => {
        if (!snap.exists()) return;
        const data = {id:snap.id, _watching:true, ...snap.data()};
        const i = this.parties.findIndex(p => p.id === snap.id);
        if (i >= 0) this.parties[i] = data; else this.parties.push(data);
        this.applyIncomingPatch(data);
        renderSocial();
      });
      this.unsubs.push(unsub);
      this.parties.push({id:pid, _watching:true, name:'…', members:{}});
    });
  },

  applyIncomingPatch(party){
    const mine = party.members && party.members[this.user.uid];
    if (!mine || !mine.patchedBy || mine.patchedBy === this.user.uid) return;
    if ((mine.patchedAt || 0) <= this.lastPatchAt) return;
    this.lastPatchAt = mine.patchedAt;
    const c = state.characters.find(x => x.id === mine.charId);
    if (!c || !mine.char) return;
    c.health.current = mine.char.health.current;
    c.focus.current = mine.char.focus.current;
    c.investiture.current = mine.char.investiture.current;
    c.conditions = mine.char.conditions || {};
    if (mine.char.goals) mine.char.goals.forEach((g, i) => { if (c.goals[i]) c.goals[i].ticks = g.ticks; });
    c.updatedAt = Date.now();
    save(); render();
    toast(`${party.name}: your game master updated this sheet.`);
  },

  snapshot(c){
    const d = derive(c);
    return {
      id:c.id, name:c.name, level:c.level, tier:d.tier, paths:c.paths, ancestry:c.ancestry,
      health:{current:c.health.current, max:d.maxHealth},
      focus:{current:c.focus.current, max:d.maxFocus},
      investiture:{current:c.investiture.current, max:d.maxInvestiture, radiant:c.radiant},
      defenses:{physical:d.physicalDefense, cognitive:d.cognitiveDefense, spiritual:d.spiritualDefense},
      deflect:d.deflect, movement:d.movement,
      conditions:c.conditions || {},
      surges:(c.skills.custom_physical.name || '') + (c.skills.custom_spiritual.name ? ', ' + c.skills.custom_spiritual.name : ''),
      goals:(c.goals || []).map(g => ({text:g.text, ticks:g.ticks})),
      spren:(c.spren && c.spren.order) ? {name:c.spren.name, order:c.spren.order} : null
    };
  },

  pushCharacter(){
    if (!this.on || !this.user) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(async () => {
      const c = activeChar();
      if (!c) return;
      for (const p of this.parties){
        const mine = p.members && p.members[this.user.uid];
        if (!mine || mine.charId !== c.id) continue;
        try {
          await this.fb.updateDoc(this.doc('parties', p.id), {
            [`members.${this.user.uid}.char`]: this.snapshot(c),
            [`members.${this.user.uid}.updatedAt`]: Date.now(),
            [`members.${this.user.uid}.patchedBy`]: this.user.uid,
            [`members.${this.user.uid}.patchedAt`]: Date.now()
          });
        } catch(e){ /* offline is fine — local copy still holds */ }
      }
    }, 250);
  }
};

function readAvatarFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 160;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

$('#avatarfile').addEventListener('change', async e => {

function renameLocalUsername(newName){
  newName = (newName || '').replace(/^@/, '').trim();
  if (!/^[A-Za-z0-9_]{3,20}$/.test(newName)) return toast('Use 3–20 letters, numbers, or underscores.');
  const accounts = loadAccounts();
  const oldKey = state.session.username.toLowerCase();
  const newKey = newName.toLowerCase();
  if (newKey !== oldKey && accounts[newKey]) return toast('That handle is already taken on this device.');
  const acc = accounts[oldKey] || {username:newName, password:''};
  delete accounts[oldKey];
  acc.username = newName;
  accounts[newKey] = acc;
  saveAccounts(accounts);
  state.session.username = newName;
  state.profile.username = newName;
  save();
  updateAccountChrome();
  toast(`Username updated to @${newName}.`);
  openProfile();
}

async function joinCampaignHome(code){
  code = (code || '').trim();
  if (!/^\d{6}$/.test(code)) return toast('Enter the 6-digit join code.');
  if (cloud.on && cloud.user){
    try {
      const q = cloud.fb.query(cloud.fb.collection(cloud.db, 'parties'), cloud.fb.where('code', '==', code));
      const snap = await cloud.fb.getDocs(q);
      if (snap.empty) return toast('No campaign uses that code.');
      const partyDoc = snap.docs[0];
      await cloud.fb.updateDoc(partyDoc.ref, {
        memberUids:cloud.fb.arrayUnion(cloud.user.uid),
        [`members.${cloud.user.uid}`]:{username:cloud.me.username, role:'Player', charId:'', char:null, updatedAt:Date.now()}
      });
      await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {parties:cloud.fb.arrayUnion(partyDoc.id)}, {merge:true});
      state.activePartyId = partyDoc.id;
      toast('Joined the campaign.');
      renderHomeTab();
    } catch(err){ toast('Could not join: ' + err.message); }
    return;
  }
  const p = state.localParties.find(x => x.code === code);
  if (!p) return toast('No campaign with that code exists on this device.');
  state.activePartyId = p.id;
  renderHomeTab();
  toast(`Joined ${p.name}.`);
}

/* Members render in the party's fixed memberUids order (an array — stable),
   never by Object.entries() key order on the members map (a Firestore map field,
   whose key order is not guaranteed and was shuffling the party cards). */
function orderedMembers(party){
  const members = party.members || {};
  const order = (party.memberUids || []).filter(uid => members[uid]);
  Object.keys(members).forEach(uid => { if (!order.includes(uid)) order.push(uid); });
  return order.map(uid => [uid, members[uid]]);
}

/* ---------- social actions ---------- */
function handleSocialAction(action, node, c){
  const val = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
  const pid = node.dataset.pid;

  switch (action){
    /* local parties */
    case 'create-local-party': {
      const name = val('localpartyname');
      if (!name) return toast('Give the party a name.');
      const p = {id:uid(), name, code:genCode(), gmName:state.profile.username || (state.session && state.session.username) || 'You', sessionDate:'', charIds:[]};
      state.localParties.push(p);
      state.activePartyId = p.id;
      renderSocial(); save();
      toast(`Campaign created. Join code: ${p.code}`);
      break;
    }
    case 'select-local-party': state.activePartyId = pid; renderSocial(); break;
    case 'del-local-party': {
      const gone = state.localParties.find(x => x.id === pid);
      if (gone) gone.charIds.forEach(cid => {
        const ch = state.characters.find(x => x.id === cid);
        if (ch && ch.partyId === pid) ch.partyId = null;
      });
      state.localParties = state.localParties.filter(p => p.id !== pid);
      renderSocial(); save(); break;
    }
    case 'add-local-char': {
      const p = state.localParties.find(x => x.id === pid);
      const sel = $('#localcharpick');
      const cid = sel ? sel.value : '';
      if (!p || !cid){ toast('Pick a character to add.'); break; }
      if (p.charIds.includes(cid)){ toast('That character is already at the table.'); break; }
      const ch = state.characters.find(x => x.id === cid);
      if (ch && ch.partyId && ch.partyId !== p.id){
        const other = state.localParties.find(x => x.id === ch.partyId);
        toast(`${ch.name} is already in ${other ? other.name : 'another campaign'}. Duplicate the character to use it here too.`);
        break;
      }
      p.charIds.push(cid);
      if (ch) ch.partyId = p.id;
      renderSocial(); save();
      toast(`${ch ? ch.name : 'Character'} added to ${p.name}.`);
      break;
    }
    case 'local-adjust': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      if (!target) break;
      const kind = node.dataset.kind, by = parseInt(node.dataset.by, 10);
      const d = derive(target);
      const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[kind];
      target[kind].current = clamp(target[kind].current + by, 0, max);
      target.updatedAt = Date.now();
      renderSocial(); save(); break;
    }
    case 'local-cond': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      if (!target) break;
      const n = node.dataset.cond;
      target.conditions[n] = !target.conditions[n];
      if (!target.conditions[n]) delete target.conditions[n];
      target.updatedAt = Date.now();
      renderSocial(); save(); break;
    }
    case 'local-goal': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      const g = target && target.goals[parseInt(node.dataset.g, 10)];
      if (!g) break;
      const t = parseInt(node.dataset.t, 10);
      g.ticks[t] = !g.ticks[t];
      target.updatedAt = Date.now();
      renderSocial(); save(); break;
    }
    case 'local-refill-health': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      if (!target) break;
      target.health.current = derive(target).maxHealth;
      target.updatedAt = Date.now();
      renderSocial(); save(); break;
    }
    case 'local-reorder': {
      const p = state.localParties.find(x => x.charIds.includes(node.dataset.uid));
      if (!p) break;
      const i = p.charIds.indexOf(node.dataset.uid);
      const j = i + parseInt(node.dataset.dir, 10);
      if (j < 0 || j >= p.charIds.length) break;
      [p.charIds[i], p.charIds[j]] = [p.charIds[j], p.charIds[i]];
      renderSocial(); save(); break;
    }

    /* auth */
    case 'sign-in': cloud.signIn(val('authemail'), val('authpw')); break;
    case 'sign-up': cloud.signUp(val('authemail'), val('authpw')); break;
    case 'sign-out': cloud.signOut(); break;
    case 'claim-username': claimUsername(val('unameinput')); break;

    /* friends */
    case 'send-request': sendFriendRequest(val('friendinput')); break;
    case 'accept-request': acceptRequest(node.dataset.uid); break;
    case 'decline-request': declineRequest(node.dataset.uid); break;

    /* parties */
    case 'create-party': createParty(val('partyname')); break;
    case 'select-party': state.activePartyId = pid; renderSocial(); break;
    case 'party-add': partyAdd(pid, val('partyadd')); break;
    case 'leave-party': leaveParty(pid); break;
    case 'party-adjust': partyPatch(node, m => {
      const kind = node.dataset.kind, by = parseInt(node.dataset.by, 10);
      m.char[kind].current = clamp(m.char[kind].current + by, 0, m.char[kind].max);
    }); break;
    case 'party-cond': partyPatch(node, m => {
      const n = node.dataset.cond;
      m.char.conditions = m.char.conditions || {};
      if (m.char.conditions[n]) delete m.char.conditions[n]; else m.char.conditions[n] = true;
    }); break;
    case 'party-goal': partyPatch(node, m => {
      const g = m.char.goals[parseInt(node.dataset.g, 10)];
      const t = parseInt(node.dataset.t, 10);
      g.ticks[t] = !g.ticks[t];
    }); break;
    case 'party-refill-health': partyPatch(node, m => { m.char.health.current = m.char.health.max; }); break;
    case 'party-reorder': {
      const party = cloud.parties.find(p => p.members && p.members[node.dataset.uid]);
      if (!party) break;
      const order = orderedMembers(party).map(([uid]) => uid);
      const i = order.indexOf(node.dataset.uid);
      const j = i + parseInt(node.dataset.dir, 10);
      if (j < 0 || j >= order.length) break;
      [order[i], order[j]] = [order[j], order[i]];
      party.memberUids = order;
      renderSocial();
      cloud.fb.updateDoc(cloud.doc('parties', party.id), {memberUids:order}).catch(() => {});
      break;
    }
  }
}

document.addEventListener('input', e => {
  if (e.target.id === 'vaultsearch'){ vaultFilter = e.target.value; renderHomeTab(); }
});
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-change="assign-char"]');
  if (sel){ assignCharacter(sel.dataset.pid, sel.value); return; }

  if (e.target.id === 'vaultsortsel'){ vaultSort = e.target.value; renderHomeTab(); return; }

  const localDate = e.target.closest('#localsessiondate');
  if (localDate){
    const p = state.localParties.find(x => x.id === localDate.dataset.pid);
    if (p){ p.sessionDate = localDate.value; save(); renderHomeTab(); }
    return;
  }
  const cloudDate = e.target.closest('#partysessiondate');
  if (cloudDate){
    const party = cloud.parties.find(x => x.id === cloudDate.dataset.pid);
    if (party) party.sessionDate = cloudDate.value;
    cloud.fb.updateDoc(cloud.doc('parties', cloudDate.dataset.pid), {sessionDate:cloudDate.value}).catch(() => {});
    return;
  }
  const visctl = e.target.closest('[data-visctl]');
  if (visctl){
    const field = visctl.dataset.visctl, mUid = visctl.dataset.uid, pid = visctl.dataset.pid;
    const party = cloud.parties.find(p => p.id === pid);
    if (party && party.members[mUid]) party.members[mUid][field] = visctl.checked;
    cloud.fb.updateDoc(cloud.doc('parties', pid), {[`members.${mUid}.${field}`]:visctl.checked}).catch(() => {});
    return;
  }
});

document.addEventListener('click', e => {
  const visg = e.target.closest('[data-visglobal]');
  if (!visg) return;
  const pid = visg.dataset.visglobal;
  const party = cloud.parties.find(p => p.id === pid);
  if (!party) return;
  const next = party.visibility === 'all' ? 'own' : 'all';
  party.visibility = next;
  visg.setAttribute('aria-pressed', String(next === 'all'));
  cloud.fb.updateDoc(cloud.doc('parties', pid), {visibility:next}).catch(() => {});
});

/* ---------- firestore operations ---------- */
async function claimUsername(raw){
  const name = raw.replace(/^@/, '').trim();
  if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return toast('Use 3–20 letters, numbers, or underscores.');
  const lower = name.toLowerCase();
  try {
    const taken = await cloud.fb.getDoc(cloud.doc('usernames', lower));
    if (taken.exists() && taken.data().uid !== cloud.user.uid) return toast('That handle is taken.');
    await cloud.fb.setDoc(cloud.doc('usernames', lower), {uid:cloud.user.uid, username:name});
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid),
      {username:name, usernameLower:lower, friends:cloud.me.friends || [], parties:cloud.me.parties || []}, {merge:true});
    toast(`You are @${name}.`);
  } catch(err){ toast('Could not save that handle: ' + err.message); }
}

async function lookupUser(handle){
  const lower = handle.replace(/^@/, '').trim().toLowerCase();
  if (!lower) return null;
  const snap = await cloud.fb.getDoc(cloud.doc('usernames', lower));
  return snap.exists() ? snap.data() : null;
}

async function sendFriendRequest(handle){
  try {
    const target = await lookupUser(handle);
    if (!target) return toast('No one is using that handle.');
    if (target.uid === cloud.user.uid) return toast('That is you.');
    await cloud.fb.setDoc(cloud.doc('users', target.uid, 'requests', cloud.user.uid),
      {username:cloud.me.username, at:Date.now()});
    toast(`Request sent to @${target.username}.`);
  } catch(err){ toast('Request failed: ' + err.message); }
}

async function acceptRequest(fromUid){
  try {
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {friends:cloud.fb.arrayUnion(fromUid)}, {merge:true});
    await cloud.fb.setDoc(cloud.doc('users', fromUid), {friends:cloud.fb.arrayUnion(cloud.user.uid)}, {merge:true});
    await cloud.fb.deleteDoc(cloud.doc('users', cloud.user.uid, 'requests', fromUid));
    toast('Friend added.');
  } catch(err){ toast('Could not accept: ' + err.message); }
}
async function declineRequest(fromUid){
  try { await cloud.fb.deleteDoc(cloud.doc('users', cloud.user.uid, 'requests', fromUid)); }
  catch(err){ toast('Could not decline: ' + err.message); }
}

async function createParty(name){
  if (!name) return toast('Give the party a name.');
  try {
    const c = activeChar();
    const useChar = c && !c.partyId;
    const ref = await cloud.fb.addDoc(cloud.fb.collection(cloud.db, 'parties'), {
      name, gm:cloud.user.uid, code:genCode(), sessionDate:'', visibility:'own', memberUids:[cloud.user.uid],
      members:{[cloud.user.uid]:{username:cloud.me.username, role:'GM', charId: useChar ? c.id : '', char: useChar ? cloud.snapshot(c) : null, updatedAt:Date.now()}}
    });
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {parties:cloud.fb.arrayUnion(ref.id)}, {merge:true});
    if (useChar){ c.partyId = ref.id; save(); }
    state.activePartyId = ref.id;
    renderHomeTab(); renderSocial();
    toast('Campaign created. You are the game master.');
  } catch(err){ toast('Could not create the party: ' + err.message); }
}

async function partyAdd(pid, handle){
  try {
    const target = await lookupUser(handle);
    if (!target) return toast('No one is using that handle.');
    await cloud.fb.updateDoc(cloud.doc('parties', pid), {
      memberUids:cloud.fb.arrayUnion(target.uid),
      [`members.${target.uid}`]:{username:target.username, role:'Player', charId:'', char:null, updatedAt:Date.now()}
    });
    await cloud.fb.setDoc(cloud.doc('users', target.uid), {parties:cloud.fb.arrayUnion(pid)}, {merge:true});
    toast(`@${target.username} added.`);
  } catch(err){ toast('Could not add them: ' + err.message); }
}

async function assignCharacter(pid, charId){
  const party = cloud.parties.find(p => p.id === pid);
  const mine = party && party.members[cloud.user.uid];
  const prevCharId = mine && mine.charId;

  if (!charId){
    if (prevCharId){
      const prev = state.characters.find(x => x.id === prevCharId);
      if (prev && prev.partyId === pid){ prev.partyId = null; save(); }
    }
    try {
      await cloud.fb.updateDoc(cloud.doc('parties', pid), {
        [`members.${cloud.user.uid}.charId`]:'',
        [`members.${cloud.user.uid}.char`]:null,
        [`members.${cloud.user.uid}.patchedBy`]:cloud.user.uid,
        [`members.${cloud.user.uid}.updatedAt`]:Date.now()
      });
      renderSocial();
      toast('You are no longer playing a character in this party.');
    } catch(err){ toast('Could not update: ' + err.message); }
    return;
  }

  const c = state.characters.find(x => x.id === charId);
  if (!c) return;
  if (c.partyId && c.partyId !== pid){
    const other = cloud.parties.find(p => p.id === c.partyId) || state.localParties.find(p => p.id === c.partyId);
    toast(`${c.name} is already in ${other ? other.name : 'another campaign'}. Duplicate the character to use it here too.`);
    renderSocial();
    return;
  }
  try {
    await cloud.fb.updateDoc(cloud.doc('parties', pid), {
      [`members.${cloud.user.uid}.charId`]:charId,
      [`members.${cloud.user.uid}.char`]:cloud.snapshot(c),
      [`members.${cloud.user.uid}.patchedBy`]:cloud.user.uid,
      [`members.${cloud.user.uid}.updatedAt`]:Date.now()
    });
    if (prevCharId && prevCharId !== charId){
      const prev = state.characters.find(x => x.id === prevCharId);
      if (prev && prev.partyId === pid) prev.partyId = null;
    }
    c.partyId = pid;
    save();
    toast(`${c.name} is now your character in this party.`);
  } catch(err){ toast('Could not assign: ' + err.message); }
}

async function leaveParty(pid){
  try {
    const party = cloud.parties.find(p => p.id === pid);
    const mine = party && party.members[cloud.user.uid];
    if (mine && mine.charId){
      const own = state.characters.find(x => x.id === mine.charId);
      if (own && own.partyId === pid){ own.partyId = null; save(); }
    }
    await cloud.fb.updateDoc(cloud.doc('parties', pid), {memberUids:cloud.fb.arrayRemove(cloud.user.uid)});
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {parties:cloud.fb.arrayRemove(pid)}, {merge:true});
    cloud.parties = cloud.parties.filter(p => p.id !== pid);
    state.activePartyId = null;
    renderSocial();
    toast('You left the party.');
  } catch(err){ toast('Could not leave: ' + err.message); }
}

async function partyPatch(node, mutate){
  const party = cloud.parties.find(p => p.members && p.members[node.dataset.uid]);
  if (!party) return;
  const m = JSON.parse(JSON.stringify(party.members[node.dataset.uid]));
  if (!m.char) return;
  mutate(m);
  try {
    await cloud.fb.updateDoc(cloud.doc('parties', party.id), {
      [`members.${node.dataset.uid}.char`]:m.char,
      [`members.${node.dataset.uid}.patchedBy`]:cloud.user.uid,
      [`members.${node.dataset.uid}.patchedAt`]:Date.now()
    });
    if (node.dataset.uid === cloud.user.uid){
      const own = state.characters.find(x => x.id === m.charId);
      if (own){
        own.health.current = m.char.health.current;
        own.focus.current = m.char.focus.current;
        own.investiture.current = m.char.investiture.current;
        own.conditions = m.char.conditions || {};
        (m.char.goals || []).forEach((g, i) => { if (own.goals[i]) own.goals[i].ticks = g.ticks; });
        own.updatedAt = Date.now();
        save();
      }
    }
  } catch(err){ toast('Change did not save: ' + err.message); }
}

    await cloud.connect();
  }
  switchView(state.session ? 'main' : 'auth');
  setSavePill('saved');
})();
