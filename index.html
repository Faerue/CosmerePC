<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radiant Sheet — Cosmere RPG Character Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5;
  --bg-2:#F3EEE9;
  --card:rgba(255,255,255,.62);
  --card-solid:#FFFDFB;
  --ink:#2D2438;
  --ink-soft:#6B5F76;
  --ink-faint:#9A8FA3;
  --accent:#C88A8A;
  --accent-2:#D4A373;
  --border:#E8C5C8;
  --border-soft:#EFE2E0;
  --field:#FFFFFF;
  --shadow:0 1px 2px rgba(45,36,56,.04), 0 12px 28px -18px rgba(45,36,56,.28);
  --ok:#7C9A80;
  --warn:#C77B5A;
  --radius:16px;
  --fs:1rem;
}
[data-theme="dark"]{
  --bg:#16151D;
  --bg-2:#1C1A25;
  --card:rgba(34,31,45,.72);
  --card-solid:#221F2D;
  --ink:#F0EDF5;
  --ink-soft:#B7AFC4;
  --ink-faint:#7E7590;
  --accent:#E0A9A9;
  --accent-2:#E3BC8E;
  --border:#3A3348;
  --border-soft:#2C2739;
  --field:#1A1824;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 34px -22px rgba(0,0,0,.9);
  --ok:#8FB894;
  --warn:#E09A76;
}
html[data-scale="s"]{--fs:.9rem}
html[data-scale="m"]{--fs:1rem}
html[data-scale="l"]{--fs:1.12rem}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:var(--fs);
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 82% -12%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    radial-gradient(900px 500px at 8% 4%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 65%),
    var(--bg);
  background-attachment:fixed;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.55rem clamp(.6rem,2vw,1.4rem);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:baseline;gap:.5rem;margin-right:.2rem}
button.brand{cursor:pointer}
button.brand:hover b{color:var(--accent)}
.brand .glyph{width:22px;height:22px;flex:0 0 auto;align-self:center}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;letter-spacing:.02em}
.brand span{font-size:.68rem;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
.spacer{flex:1 1 auto}
select.charpick{
  background:var(--field);border:1px solid var(--border);border-radius:999px;
  padding:.4rem .9rem;max-width:44vw;
}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;
  border:1px solid var(--border);border-radius:999px;padding:.36rem .8rem;
  background:var(--card);font-size:.86rem;transition:border-color .15s,background .15s;
}
.pill:hover{border-color:var(--accent)}
.pill.tier{border-style:dashed;color:var(--ink-soft)}
.pill.saved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.icon{padding:.36rem .5rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.pending{background:var(--accent-2)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:.2rem;padding:.5rem clamp(.6rem,2vw,1.4rem) 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;padding:.5rem .9rem;border-radius:10px 10px 0 0;
  color:var(--ink-soft);font-size:.92rem;font-weight:500;border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--card)}

main{padding:.9rem clamp(.6rem,2vw,1.4rem) 5rem;max-width:1500px;margin:0 auto}

/* ---------- cards ---------- */
.card{
  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:.9rem 1rem 1rem;
  margin-bottom:.9rem;
}
.card > h3{
  font-size:1.18rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  margin-bottom:.15rem;
}
.card > h3 + .rule{margin-bottom:.7rem}
.rule{height:1px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent-2) 70%,transparent) 38%,transparent 92%);border:0;margin:.2rem 0 .6rem}
.hint{font-size:.76rem;color:var(--ink-faint);font-weight:400}

/* identity header */
.identity{display:grid;grid-template-columns:2fr 1.4fr 1fr .7fr;gap:.7rem}
.identity .f:nth-child(1){grid-column:span 2}
@media(max-width:820px){.identity{grid-template-columns:1fr 1fr}.identity .f:nth-child(1){grid-column:span 2}}
.f{display:flex;flex-direction:column;gap:.25rem}
.f > label{font-size:.72rem;color:var(--ink-faint);letter-spacing:.06em}
input[type=text],input[type=number],input[type=password],input[type=email],textarea,select{
  background:var(--field);border:1px solid var(--border-soft);border-radius:10px;
  padding:.45rem .6rem;width:100%;transition:border-color .15s, box-shadow .15s;
}
input:hover,textarea:hover,select:hover{border-color:var(--border)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:5.5rem;line-height:1.55}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- realms ---------- */
.realms{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;align-items:start}
@media(max-width:1000px){.realms{grid-template-columns:1fr}}
.realm{padding-top:.8rem}
.realm-head{text-align:center;margin-bottom:.5rem}
.realm-head h2{font-size:1.5rem;font-variant:small-caps;letter-spacing:.06em}
.realm-head p{margin:.05rem 0 0;font-size:.73rem;color:var(--ink-faint)}
.trio{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center}
.attr{
  text-align:center;border:1px solid var(--border);border-radius:12px;background:var(--card-solid);
  padding:.4rem .3rem .5rem;
}
.attr .nm{font-size:.7rem;color:var(--ink-soft);letter-spacing:.08em}
.attr .stepper{display:flex;align-items:center;justify-content:center;gap:.35rem;margin-top:.1rem}
.attr .stepper button{width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--border-soft);color:var(--ink-soft);line-height:1}
.attr .stepper button:hover{border-color:var(--accent);color:var(--accent)}
.attr .val{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:600;min-width:1.4rem}
.shield{
  width:78px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent-2) 16%,transparent));
  border:1px solid var(--border);
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);
  padding-bottom:.9rem;
}
.shield .lbl{font-size:.6rem;letter-spacing:.1em;color:var(--ink-soft)}
.shield .num{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;line-height:1}
.defbonus{width:64px;margin:.15rem auto 0}
.defbonus input{text-align:center;padding:.15rem;font-size:.74rem}

/* pools */
.pool{border:1px solid var(--border-soft);border-radius:12px;background:var(--card-solid);padding:.5rem .6rem;margin-top:.6rem}
.pool .top{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.pool .top b{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600}
.pool .top small{color:var(--ink-faint);font-size:.72rem}
.track{display:flex;align-items:center;gap:.4rem;margin-top:.35rem}
.track button{width:1.9rem;height:1.9rem;border-radius:9px;border:1px solid var(--border);color:var(--ink-soft)}
.track button:hover{border-color:var(--accent);color:var(--accent)}
.track input{text-align:center;font-size:1.1rem;font-weight:600;padding:.25rem}
.track .of{color:var(--ink-faint);font-size:.9rem}
.track .max{font-family:'Cormorant Garamond',serif;font-size:1.35rem;min-width:1.6rem;text-align:center}
.bar{height:5px;border-radius:99px;background:var(--border-soft);margin-top:.4rem;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

/* skills */
.skill{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.5rem;align-items:center;padding:.22rem 0;border-bottom:1px dotted var(--border-soft)}
.skill:last-child{border-bottom:0}
.skill .mod{
  text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;
  border:1px solid var(--border);border-radius:9px;background:var(--card-solid);padding:.1rem 0;cursor:pointer;
}
.skill .mod:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card-solid))}
.skill .nm{font-size:.88rem}
.skill .nm .at{color:var(--ink-faint);font-size:.74rem}
.skill .nm input{padding:.2rem .4rem;font-size:.84rem}
.pips{display:flex;gap:.22rem}
.pips i{
  width:.82rem;height:.82rem;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;display:block;
  transition:background .12s,border-color .12s;
}
.pips i.on{background:linear-gradient(150deg,var(--accent),var(--accent-2));border-color:transparent}
.customline{display:grid;grid-template-columns:1fr 4.2rem;gap:.3rem}

/* lookups */
.lookups{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;text-align:center}
@media(max-width:700px){.lookups{grid-template-columns:repeat(2,1fr)}}
.lookup{border:1px solid var(--border-soft);border-radius:12px;padding:.5rem;background:var(--card-solid)}
.lookup .lbl{font-size:.68rem;color:var(--ink-faint);letter-spacing:.07em}
.lookup .v{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600}

/* generic rows/tables */
.rows{display:flex;flex-direction:column;gap:.4rem}
.row{display:grid;gap:.35rem;align-items:center}
.wrow{grid-template-columns:1.4fr 1fr .8fr 1.1fr 1fr auto auto}
@media(max-width:900px){.wrow{grid-template-columns:1fr 1fr}}
.thead{font-size:.7rem;color:var(--ink-faint);letter-spacing:.05em;padding-left:.2rem}
@media(max-width:900px){.thead{display:none}}
.iconbtn{border:1px solid var(--border-soft);border-radius:9px;padding:.35rem .55rem;color:var(--ink-soft);font-size:.85rem}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--border);border-radius:999px;padding:.42rem .95rem;background:var(--card-solid);font-size:.87rem;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
[data-theme="dark"] .btn.primary{color:#1A1824}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
[data-theme="dark"] .btn.primary:hover{color:#1A1824}
.btn.ghost{background:none}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.addbtn{margin-top:.5rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem;min-height:1.9rem}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;
  border:1px solid var(--border);border-radius:999px;padding:.22rem .4rem .22rem .7rem;
  background:color-mix(in srgb,var(--accent) 9%,var(--card-solid));
}
.chip button{color:var(--ink-faint);font-size:.95rem;line-height:1;padding:0 .15rem}
.chip button:hover{color:var(--warn)}
.chip .kind{font-size:.62rem;color:var(--ink-faint);letter-spacing:.06em}
.combo{position:relative}
.combo .menu{
  position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:240px;overflow:auto;
  background:var(--card-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:.25rem;
}
.combo .menu button{display:block;width:100%;text-align:left;padding:.34rem .55rem;border-radius:8px;font-size:.85rem}
.combo .menu button:hover,.combo .menu button.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.combo .menu .grp{font-size:.66rem;color:var(--ink-faint);letter-spacing:.1em;padding:.35rem .55rem .15rem}
.slots{font-size:.76rem;color:var(--ink-faint)}
.slots b{color:var(--accent)}

/* conditions */
.conds{display:flex;flex-wrap:wrap;gap:.3rem}
.cond{border:1px solid var(--border-soft);border-radius:999px;padding:.22rem .65rem;font-size:.78rem;color:var(--ink-soft)}
.cond[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
[data-theme="dark"] .cond[aria-pressed="true"]{color:#1A1824}

/* goals */
.goal{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center}
.ticks{display:flex;gap:.3rem}
.ticks i{width:1rem;height:1rem;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;display:block}
.ticks i.on{background:linear-gradient(150deg,var(--accent),var(--accent-2));border-color:transparent}

/* back page */
.back-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem;align-items:start}
@media(max-width:1000px){.back-grid{grid-template-columns:1fr}}

/* party */
.party-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.9rem}
.member{border:1px solid var(--border-soft);border-radius:14px;background:var(--card-solid);padding:.75rem .85rem}
.member h4{font-size:1.15rem}
.member .sub{font-size:.74rem;color:var(--ink-faint);margin-bottom:.4rem}
.member .defs{display:flex;gap:.4rem;margin:.5rem 0}
.member .defs div{flex:1;text-align:center;border:1px solid var(--border-soft);border-radius:9px;padding:.2rem}
.member .defs .v{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600}
.member .defs .l{font-size:.6rem;color:var(--ink-faint)}
.badge{display:inline-block;font-size:.64rem;letter-spacing:.08em;border:1px solid var(--border);border-radius:999px;padding:.05rem .5rem;color:var(--accent)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-items:start}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.listitem{display:flex;align-items:center;justify-content:space-between;gap:.5rem;border-bottom:1px solid var(--border-soft);padding:.42rem 0}
.listitem:last-child{border-bottom:0}
.empty{color:var(--ink-faint);font-size:.85rem;padding:.5rem 0}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
  background:color-mix(in srgb,var(--ink) 42%,transparent);backdrop-filter:blur(3px);padding:1rem;overflow:auto;
}
.overlay.open{display:flex}
.modal{
  background:var(--card-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  width:min(620px,100%);margin:min(6vh,4rem) 0 3rem;padding:1.1rem 1.2rem 1.3rem;
}
.modal h2{font-size:1.6rem}
.modal section{margin-top:1rem}
.modal section > h4{font-size:1.05rem;font-family:'Cormorant Garamond',serif;margin-bottom:.35rem}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{padding:.35rem .9rem;font-size:.85rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1A1824}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.35rem 0}
.switch{width:44px;height:25px;border-radius:99px;border:1px solid var(--border);background:var(--field);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink-faint);transition:transform .18s,background .18s}
.switch[aria-pressed="true"]{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch[aria-pressed="true"]::after{transform:translateX(19px);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* dice tray */
.tray{
  position:fixed;right:clamp(.6rem,2vw,1.4rem);bottom:1rem;z-index:50;width:min(310px,calc(100vw - 1.6rem));
  background:var(--card-solid);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
}
.tray header{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;border-bottom:1px solid var(--border-soft)}
.tray header h4{font-size:1.05rem}
.tray .log{max-height:min(38vh,300px);overflow:auto;padding:.4rem .75rem .7rem}
.tray.collapsed .log,.tray.collapsed .quick{display:none}
html[data-dice="info"] .quick{display:none}
[data-test]{cursor:pointer}
html[data-dice="disabled"] [data-test]{cursor:default;pointer-events:none;opacity:.65}
.quick{display:flex;gap:.3rem;flex-wrap:wrap;padding:.5rem .75rem;border-top:1px solid var(--border-soft)}
.quick button{font-size:.74rem;border:1px solid var(--border-soft);border-radius:8px;padding:.2rem .5rem;color:var(--ink-soft)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.roll{border-bottom:1px dotted var(--border-soft);padding:.4rem 0;font-size:.84rem}
.roll:last-child{border-bottom:0}
.roll .what{color:var(--ink-soft);font-size:.76rem;display:flex;justify-content:space-between;gap:.5rem}
.roll .total{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;line-height:1.1}
.roll .parts{color:var(--ink-faint);font-size:.74rem}
.plot{font-size:.72rem;letter-spacing:.04em}
.plot.opp{color:var(--ok)}
.plot.comp{color:var(--warn)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:1.2rem;z-index:70;
  background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:999px;font-size:.85rem;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:.95}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* radiant ideals */
.ideal{border:1px solid var(--border-soft);border-radius:12px;background:var(--card-solid);padding:.5rem .65rem;margin-bottom:.4rem}
.ideal input{margin-top:.35rem}

/* rules lookup drawer */
.drawer-overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb, var(--ink) 38%, transparent);backdrop-filter:blur(2px)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(400px,100vw);
  background:var(--card-solid);border-left:1px solid var(--border);box-shadow:-18px 0 40px -20px rgba(0,0,0,.35);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;
}
.drawer.open{transform:translateX(0)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border-bottom:1px solid var(--border-soft)}
.drawer header h4{font-size:1.3rem}
.drawer > input{margin:.7rem 1rem 0;width:calc(100% - 2rem)}
.rulesbody{flex:1;overflow:auto;padding:.6rem 1rem 1.4rem}
.rulesbody h5{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--accent);margin:1rem 0 .3rem;letter-spacing:.03em}
.rulesbody h5:first-child{margin-top:.2rem}
.ruleitem{padding:.4rem 0;border-bottom:1px dotted var(--border-soft)}
.ruleitem b{font-size:.9rem}
.ruleitem p{margin:.15rem 0 0;font-size:.8rem;color:var(--ink-soft)}
.badgecount{
  position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:99px;
  background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;
}
[data-theme="dark"] .badgecount{color:#1A1824}

/* home dashboard */

<script>
/* ============================================================
   Radiant Sheet — Cosmere RPG character & party manager
   Single file. No build step. LocalStorage by default,
   optional Firebase sync configured in Settings.
   ============================================================ */

'use strict';

/* ---------- static game data ---------- */
const ATTRS = {
  str:{name:'Strength', short:'STR', realm:'physical'},
  spd:{name:'Speed', short:'SPD', realm:'physical'},
  int:{name:'Intellect', short:'INT', realm:'cognitive'},
  wil:{name:'Willpower', short:'WIL', realm:'cognitive'},
  awa:{name:'Awareness', short:'AWA', realm:'spiritual'},
  pre:{name:'Presence', short:'PRE', realm:'spiritual'}
};

const REALMS = [
  {key:'physical',  name:'Physical',  blurb:'Body, motion, and the world you can touch', attrs:['str','spd'],
   skills:[['agility','Agility','spd'],['athletics','Athletics','str'],['heavyWeapons','Heavy Weapons','str'],
           ['lightWeapons','Light Weapons','spd'],['stealth','Stealth','spd'],['thievery','Thievery','spd']]},
  {key:'cognitive', name:'Cognitive', blurb:'Thought, memory, and learned craft', attrs:['int','wil'],
   skills:[['crafting','Crafting','int'],['deduction','Deduction','int'],['discipline','Discipline','wil'],
           ['intimidation','Intimidation','wil'],['lore','Lore','int'],['medicine','Medicine','int']]},
  {key:'spiritual', name:'Spiritual', blurb:'Connection, instinct, and force of self', attrs:['awa','pre'],
   skills:[['deception','Deception','pre'],['insight','Insight','awa'],['leadership','Leadership','pre'],
           ['perception','Perception','awa'],['persuasion','Persuasion','pre'],['survival','Survival','awa']]}
];
const ALL_SKILLS = REALMS.flatMap(r => r.skills.map(s => ({key:s[0], name:s[1], attr:s[2], realm:r.key})));

const CONDITIONS = ['Afflicted','Determined','Disoriented','Empowered','Enhanced','Exhausted','Focused',
  'Immobilized','Prone','Restrained','Slowed','Stunned','Surprised','Unconscious'];

const EXPERTISES = {
  Cultural:['Alethi','Azish','Herdazian','Iriali','Kharbranthian','Listener','Natan','Reshi','Shin','Thaylen','Unkalaki','Veden','Wayfarer'],
  Armor:['Leather Armor','Chain Armor','Breastplate','Half Plate','Full Plate','Uniform'],
  Weapon:['Axes','Crossbows','Greatswords','Hammers','Javelins','Knives','Longbows','Longspears','Longswords','Maces',
          'Poleaxes','Rapiers','Shields','Shortbows','Shortspears','Sideswords','Slings','Staves','Improvised Weapons','Unarmed Attacks'],
  Utility:['Animal Care','Armor Crafting','Engineering','Equipment Crafting','History','Military Strategy','Religion',
           'Riding Horses','Weapon Crafting','Legal Codes','Medical Logistics'],
  Specialist:['Fabrial Crafting','Half-Shards','Grandbows','Shardblades','Shardplate','Warhammers','Singer History','Knights Radiant']
};

const ARMORS = [
  {name:'No armor', deflect:0}, {name:'Uniform', deflect:1}, {name:'Leather Armor', deflect:2},
  {name:'Chain Armor', deflect:3}, {name:'Breastplate', deflect:4}, {name:'Half Plate', deflect:5},
  {name:'Full Plate', deflect:6}, {name:'Half-Shard', deflect:7}, {name:'Shardplate', deflect:8}
];

/* ---------- singer forms ---------- */
const SINGER_FORMS = {
  'None (Formless)': {bonus:{}, desc:'Between forms — no bonuses, and prone to overexertion without a rhythm to hold to.'},
  'Dullform':        {bonus:{spd:-1, wil:-1, pre:-1}, desc:'Numbed emotion and pain; tireless at labor. Common after an Everstorm without a bond.'},
  'Workform':        {bonus:{str:1}, desc:'A laborer’s build — sturdy, industrious, built for the mundane.'},
  'Warform':         {bonus:{str:1, spd:1}, desc:'Carapace thickens for battle; the common soldier form.'},
  'Nimbleform':      {bonus:{spd:1, awa:1}, desc:'Light and quick — favored by scouts, messengers, and thieves.'},
  'Mateform':        {bonus:{pre:1}, desc:'Drawn toward bonding and courtship; emotionally resonant.'},
  'Scholarform':     {bonus:{int:1}, desc:'Sharpens the mind for study, craft, and careful thought.'},
  'Artform':         {bonus:{pre:1, awa:1}, desc:'Heightens creativity, expression, and performance.'},
  'Envoyform':       {bonus:{pre:1, int:1}, desc:'A rare diplomatic form, prized for negotiation between peoples.'},
  'Willshaperform':  {bonus:{wil:1}, desc:'Resolute and unyielding — rare, and little understood by scholars.'}
};

/* ---------- radiant orders ---------- */
const RADIANT_ORDERS = [
  {name:'Windrunner',    spren:'Honorspren',          surges:'Adhesion & Gravitation'},
  {name:'Skybreaker',    spren:'Highspren',           surges:'Gravitation & Division'},
  {name:'Dustbringer',   spren:'Ashspren',            surges:'Division & Abrasion'},
  {name:'Edgedancer',    spren:'Cultivationspren',    surges:'Abrasion & Progression'},
  {name:'Truthwatcher',  spren:'Mistspren',           surges:'Progression & Illumination'},
  {name:'Lightweaver',   spren:'Cryptic',             surges:'Illumination & Transformation'},
  {name:'Elsecaller',    spren:'Inkspren',            surges:'Transformation & Transportation'},
  {name:'Willshaper',    spren:'Lightspren',          surges:'Transportation & Cohesion'},
  {name:'Stoneward',     spren:'Peakspren',           surges:'Cohesion & Tension'},
  {name:'Bondsmith',     spren:'Highspren (unique)',  surges:'Tension & Adhesion'}
];
const IDEAL_NAMES = ['First Ideal', 'Second Ideal', 'Third Ideal', 'Fourth Ideal'];

/* ---------- spheres ---------- */
const SPHERE_CHIPS_PER_MARK = 5, SPHERE_MARKS_PER_BROAM = 5;

/* ---------- rules lookup data ---------- */
const SKILL_BLURBS = {
  agility:'Balance, dodging, and fine full-body control.', athletics:'Running, jumping, climbing, swimming, and raw physical feats.',
  heavyWeapons:'Attacks with large or two-handed weapons — hammers, greatswords, poleaxes.',
  lightWeapons:'Attacks with fast, one-handed weapons — knives, sidearms, rapiers.',
  stealth:'Moving unseen and unheard.', thievery:'Sleight of hand, lockpicking, and pickpocketing.',
  crafting:'Making and repairing goods, art, and equipment.', deduction:'Puzzling out clues, patterns, and hidden meaning.',
  discipline:'Resisting mental strain, fear, and temptation.', intimidation:'Coercing others through threat or presence.',
  lore:'Recalled knowledge — history, theology, nature, the sciences.', medicine:'Diagnosing and treating injury or illness.',
  deception:'Lying convincingly and reading a lie.', insight:'Reading intentions, emotions, and the truth behind words.',
  leadership:'Inspiring, organizing, and commanding others.', perception:'Noticing what is there to be noticed.',
  persuasion:'Convincing others honestly, through logic or charm.', survival:'Tracking, foraging, and enduring the wilds.'
};
const COMBAT_ACTIONS = [
  {name:'Attack', desc:'Make a weapon or unarmed attack against a target in range.'},
  {name:'Move', desc:'Move up to your Movement rate.'},
  {name:'Full Defense', desc:'Forgo your attack to add a bonus to your Defense until your next turn.'},
  {name:'Aid Another', desc:'Help an ally, granting Advantage on their next relevant test.'},
  {name:'Charge', desc:'Move and attack in the same action, often at a penalty to Defense.'},
  {name:'Disengage', desc:'Move away from an adjacent foe without provoking a free attack.'},
  {name:'Grapple / Shove', desc:'Contest an opponent’s Athletics to restrain or move them.'},
  {name:'Ready an Action', desc:'Prepare to act on a trigger you define before your next turn.'},
  {name:'Recover', desc:'Spend your turn to shake off a condition or catch your breath.'},
  {name:'Sense Surroundings', desc:'Make a Perception or Insight test to notice details or danger.'},
  {name:'Use an Item', desc:'Draw, drink, apply, or activate an item you are carrying.'},
  {name:'Use a Surge', desc:'Spend Focus or Investiture to invoke a Radiant Surge.'}
];
const CONDITION_BLURBS = {
  Afflicted:'Suffering an ongoing malady — poison, disease, or curse.', Determined:'A rare boon condition — advantage on Discipline tests to push through.',
  Disoriented:'Confused and unable to act reliably; disadvantage on most tests.', Empowered:'A boon granting bonus dice or effect on a specific action.',
  Enhanced:'A temporary boost to an attribute or skill.', Exhausted:'Worn thin; penalties to physical tests until rested.',
  Focused:'A boon condition sharpening concentration for a task.', Immobilized:'Unable to move from your current position.',
  Prone:'Knocked down; disadvantage on most physical actions until you stand.', Restrained:'Bound or held; movement and some actions are blocked.',
  Slowed:'Movement rate is reduced.', Stunned:'Unable to take actions until the condition clears.',
  Surprised:'Caught off guard at the start of a conflict; act later, react less.', Unconscious:'Insensate and helpless.'
};
const SURGE_BLURBS = [
  {name:'Adhesion', desc:'Binds surfaces and objects together, or a person to a surface.'},
  {name:'Gravitation', desc:'Alters the direction and strength of gravity for a target.'},
  {name:'Division', desc:'Unmakes bonds at a fundamental level, corroding or dissolving matter.'},
  {name:'Abrasion', desc:'Reduces friction, letting a target slide freely or brace absolutely.'},
  {name:'Progression', desc:'Accelerates growth and healing in living things.'},
  {name:'Illumination', desc:'Bends and creates light — illusions, images, and darkness.'},
  {name:'Transformation', desc:'Changes the fundamental nature of matter, as with lifeless things given motion.'},
  {name:'Transportation', desc:'Moves a target partially or fully to Shadesmar and back.'},
  {name:'Cohesion', desc:'Softens or hardens matter, letting it be reshaped like clay.'},
  {name:'Tension', desc:'Reinforces the surface of an object, letting it hold enormous stress.'}
];

const TABLES = {
  lifting:[[0,'100 lbs'],[1,'200 lbs'],[3,'500 lbs'],[5,'1,000 lbs'],[7,'5,000 lbs'],[9,'10,000 lbs']],
  movement:[[0,'20 ft'],[1,'25 ft'],[3,'30 ft'],[5,'40 ft'],[7,'60 ft'],[9,'80 ft']],
  recovery:[[0,'d4'],[1,'d6'],[3,'d8'],[5,'d10'],[7,'d12'],[9,'d20']],
  senses:[[0,'5 ft'],[1,'10 ft'],[3,'20 ft'],[5,'50 ft'],[7,'100 ft'],[9,'Unlimited']]
};
const lookup = (table, score) => {
  let out = table[0][1];
  for (const [min, val] of table) if (score >= min) out = val;
  return out;
};

/* ---------- character factory ---------- */
const uid = () => Math.random().toString(36).slice(2, 10);

function blankSkills(){
  const s = {};
  ALL_SKILLS.forEach(sk => s[sk.key] = {ranks:0, bonus:0});
  REALMS.forEach(r => s['custom_' + r.key] = {ranks:0, bonus:0, name:'', attr:r.attrs[0]});
  return s;
}

function newCharacter(name){
  return {
    id: uid(),
    name: name || 'Unnamed Radiant',
    playerName:'', level:1, paths:'', ancestry:'', campaign:'Stormlight Archive',
    singer:false, form:'None (Formless)',
    attributes:{str:0, spd:0, int:0, wil:0, awa:0, pre:0},
    defenseBonus:{physical:0, cognitive:0, spiritual:0},
    skills: blankSkills(),
    health:{current:10, bonus:0},
    focus:{current:2, bonus:0},
    investiture:{current:0, bonus:0},
    radiant:false,
    spren:{name:'', order:'', ideals: IDEAL_NAMES.map(n => ({name:n, text:'', ticks:[false,false,false]}))},
    armor:'No armor', deflectBonus:0,
    expertises:[], expertiseBonus:0,
    talents:'',
    weapons:[],
    conditions:{}, injuries:[],
    squires:[], fabrials:[], gearWeight:0,
    spheres:{chips:0, marks:0, broams:0, notes:''}, purpose:'', obstacle:'',
    goals:[{text:'', ticks:[false,false,false]}],
    appearance:'', equipment:'', connections:'', notes:''
  };
}

/* ---------- derived values ---------- */
const tierOf = lvl => Math.max(1, Math.min(5, Math.ceil((lvl || 1) / 4)));

function formBonus(c){
  const f = c.singer && SINGER_FORMS[c.form] ? SINGER_FORMS[c.form].bonus : null;
  return f || {};
}

function derive(c){
  const fb = formBonus(c);
  const a = {}; for (const k in c.attributes) a[k] = c.attributes[k] + (fb[k] | 0);
  const d = {
    tier: tierOf(c.level),
    formBonus: fb,
    physicalDefense: 10 + a.str + a.spd + (c.defenseBonus.physical|0),
    cognitiveDefense: 10 + a.int + a.wil + (c.defenseBonus.cognitive|0),
    spiritualDefense: 10 + a.awa + a.pre + (c.defenseBonus.spiritual|0),
    lifting: lookup(TABLES.lifting, a.str),
    movement: lookup(TABLES.movement, a.spd),
    recovery: lookup(TABLES.recovery, a.wil),
    senses: lookup(TABLES.senses, a.awa),
    skills:{}
  };
  d.liftingLbs = parseInt(d.lifting.replace(/[^0-9]/g, ''), 10) || 0;
  d.maxHealth = 10 + a.str + (d.tier - 1) * 10 + (c.health.bonus|0);
  d.maxFocus = 2 + a.wil + (c.focus.bonus|0);
  d.maxInvestiture = c.radiant ? 2 + Math.max(a.awa, a.pre) + (c.investiture.bonus|0) : 0;
  const armor = ARMORS.find(x => x.name === c.armor) || ARMORS[0];
  d.deflect = armor.deflect + (c.deflectBonus|0);
  d.expertiseSlots = 2 + (a.int >= 1 ? a.int : 0) + (c.expertiseBonus|0);
  ALL_SKILLS.forEach(sk => {
    const s = c.skills[sk.key];
    d.skills[sk.key] = s.ranks + a[sk.attr] + (s.bonus|0);
  });
  REALMS.forEach(r => {
    const s = c.skills['custom_' + r.key];
    d.skills['custom_' + r.key] = s.ranks + (a[s.attr] || 0) + (s.bonus|0);
  });
  return d;
}

/* ---------- app state & persistence ---------- */
const STORE_KEY = 'radiant-sheet-v1';
const state = {
  characters:[], activeId:null, tab:'home', view:'auth', session:null,
  settings:{theme:'light', scale:'m', plotDie:true, diceMode:'disabled', firebase:{
    apiKey:'AIzaSyC6qq3jITUYJmZfbAOouPaTYn02hjrVZvs',
    authDomain:'cosmere-rpg-sheet.firebaseapp.com',
    projectId:'cosmere-rpg-sheet',
    databaseURL:''
  }},
  profile:{username:''},
  localParties:[],
  rolls:[]
};
const genCode = () => String(Math.floor(100000 + Math.random() * 900000));

function activeChar(){
  return state.characters.find(c => c.id === state.activeId) || state.characters[0];
}

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      Object.assign(state, parsed, {settings:{...state.settings, ...(parsed.settings||{})}, rolls: parsed.rolls || []});
    }
  } catch(err){ console.warn('Could not read saved data', err); }
  if (!state.characters.length){
    const c = newCharacter('Unnamed Radiant');
    state.characters = [c];
    state.activeId = c.id;
  }
  if (!state.characters.some(c => c.id === state.activeId)) state.activeId = state.characters[0].id;
  state.characters.forEach(migrate);
  (state.localParties || []).forEach(p => {
    if (!p.code) p.code = genCode();
    if (p.gmName === undefined) p.gmName = state.profile.username || 'You';
    if (p.sessionDate === undefined) p.sessionDate = '';
  });
}

function migrate(c){
  const fresh = newCharacter();
  for (const k in fresh) if (c[k] === undefined) c[k] = fresh[k];
  for (const k in fresh.skills) if (!c.skills[k]) c.skills[k] = fresh.skills[k];
  c.goals = c.goals && c.goals.length ? c.goals : [{text:'', ticks:[false,false,false]}];
  if (typeof c.spheres === 'string') c.spheres = {chips:0, marks:0, broams:0, notes:c.spheres};
  if (!c.spheres || typeof c.spheres !== 'object') c.spheres = fresh.spheres;
  if (!c.spren || typeof c.spren !== 'object') c.spren = fresh.spren;
  c.spren.ideals = (c.spren.ideals && c.spren.ideals.length === IDEAL_NAMES.length) ? c.spren.ideals : fresh.spren.ideals;
  if (!Array.isArray(c.squires)) c.squires = [];
  if (!Array.isArray(c.fabrials)) c.fabrials = [];
  if (!SINGER_FORMS[c.form]) c.form = fresh.form;
}

let saveTimer = null, saveState = 'saved';
function save(){
  setSavePill('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        characters:state.characters, activeId:state.activeId, settings:state.settings,
        profile:state.profile, localParties:state.localParties, rolls:state.rolls.slice(0,30),
        session:state.session, tab:state.tab
      }));
      setSavePill('saved');
    } catch(err){
      setSavePill('error');
      toast('Browser storage is full — export a backup file.');
    }
    cloud.pushCharacter();
  }, 420);
}
function setSavePill(mode){
  saveState = mode;
  const pill = document.getElementById('savepill');
  const text = document.getElementById('savetext');
  if (!pill) return;
  pill.classList.toggle('saved', mode === 'saved');
  pill.querySelector('.dot').classList.toggle('pending', mode !== 'saved');
  text.textContent = mode === 'saved' ? (cloud.on ? 'Synced' : 'Saved') : mode === 'saving' ? 'Saving' : 'Not saved';
}

/* ---------- tiny helpers ---------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const sgn = n => (n >= 0 ? '+' : '') + n;
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

let toastTimer;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

function getPath(obj, path){
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setPath(obj, path, value){
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}

function updatePointsSpent(){
  const line = $('#pointsline');
  if (!line) return;
  const c = activeChar();
  const spent = Object.values(c.attributes).reduce((a, b) => a + b, 0);
  const over = Object.entries(c.attributes).filter(([, v]) => v > 3).map(([k]) => ATTRS[k].short);
  line.textContent = `${spent} of 12 attribute points spent`
    + (spent > 12 ? ' — over the level 1 budget' : '')
    + (over.length ? `. Creation caps each attribute at 3: ${over.join(', ')} ${over.length > 1 ? 'are' : 'is'} above it.` : '.');
  line.style.color = (spent > 12 || over.length) ? 'var(--warn)' : '';
}

/* ============================================================
   LIVE VALUE SYNC — updates computed nodes without rebuilding
   ============================================================ */
function syncDerived(){
  const c = activeChar(), d = derive(c);
  const set = (key, val) => $$(`[data-derived="${key}"]`).forEach(n => { if (n.textContent !== String(val)) n.textContent = val; });

  ['physicalDefense','cognitiveDefense','spiritualDefense','lifting','movement','recovery','senses','deflect'].forEach(k => set(k, d[k]));
  Object.keys(ATTRS).forEach(k => set('attr.' + k, c.attributes[k]));
  Object.keys(d.skills).forEach(k => set('skill.' + k, sgn(d.skills[k])));
  set('maxhealth', d.maxHealth); set('maxfocus', d.maxFocus); set('maxinvestiture', d.maxInvestiture);
  set('expUsed', c.expertises.length); set('expSlots', d.expertiseSlots);

  [['health', d.maxHealth], ['focus', d.maxFocus], ['investiture', d.maxInvestiture]].forEach(([k, max]) => {
    const bar = $(`[data-derived="bar${k}"]`);
    if (bar) bar.style.width = (max > 0 ? clamp(c[k].current / max * 100, 0, 100) : 0) + '%';
  });

  const badge = $('#tierbadge');
  if (badge) badge.textContent = `Level ${c.level} · Tier ${d.tier}`;
  const slots = $('[data-derived="expSlots"]');
  if (slots && slots.parentElement) slots.parentElement.style.color = c.expertises.length > d.expertiseSlots ? 'var(--warn)' : '';
}

function renderCharPicker(){
  const sel = $('#charpick');
  sel.innerHTML = state.characters.map(c =>
    `<option value="${c.id}" ${c.id === state.activeId ? 'selected' : ''}>${esc(c.name || 'Unnamed')}</option>`).join('');
}

function render(){
  renderCharPicker();
  updateAccountChrome();
  if (state.tab === 'home') renderHomeTab();
  else if (state.tab === 'front') renderFront();
  else if (state.tab === 'back') renderBack();
  else renderSocial();
  syncDerived();
  renderRolls();
}

function switchTab(tab){
  state.tab = tab;
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  ['home','front','back','social'].forEach(t => $('#view-' + t).hidden = (t !== tab));
  render();
  save();
}

/* ============================================================
   DICE
   ============================================================ */
function rollDie(sides){ return 1 + Math.floor(Math.random() * sides); }

function parseDice(expr){
  // returns {total, detail} for expressions like "2d6 + 3"
  let total = 0, parts = [];
  const tokens = String(expr).replace(/\s+/g, '').match(/[+-]?[^+-]+/g) || [];
  tokens.forEach(tok => {
    const sign = tok.startsWith('-') ? -1 : 1;
    const body = tok.replace(/^[+-]/, '');
    const m = body.match(/^(\d*)d(\d+)$/i);
    if (m){
      const n = parseInt(m[1] || '1', 10), s = parseInt(m[2], 10);
      const rolls = Array.from({length:clamp(n, 1, 50)}, () => rollDie(s));
      total += sign * rolls.reduce((a, b) => a + b, 0);
      parts.push(`${sign < 0 ? '−' : ''}${n}d${s} [${rolls.join(', ')}]`);
    } else if (/^\d+$/.test(body)){
      total += sign * parseInt(body, 10);
      parts.push(`${sign < 0 ? '−' : '+'}${body}`);
    } else if (body){
      parts.push(body); // free text like STR — left for the player to add
    }
  });
  return {total, detail:parts.join(' ')};
}

function expandAttrs(expr, c){
  return String(expr).replace(/\b(STR|SPD|INT|WIL|AWA|PRE)\b/gi, m => String(c.attributes[m.toLowerCase()]));
}

function plotDie(){
  const v = rollDie(6);
  return {value:v, label: v <= 2 ? 'Complication' : v <= 4 ? 'Blank' : 'Opportunity',
          cls: v <= 2 ? 'comp' : v <= 4 ? '' : 'opp'};
}

function logRoll(entry){
  entry.at = Date.now();
  state.rolls.unshift(entry);
  state.rolls = state.rolls.slice(0, 30);
  $('#tray').classList.remove('collapsed');
  $('#traytoggle').textContent = 'Hide';
  renderRolls();
  save();
}

function renderRolls(){
  const log = $('#rolllog');
  if (!log) return;
  if (!state.rolls.length){ log.innerHTML = '<p class="empty">Rolls appear here. Tap any skill modifier to test it.</p>'; return; }
  log.innerHTML = state.rolls.map(r => `<div class="roll">
    <div class="what"><span>${esc(r.what)}</span><span>${new Date(r.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>
    <div class="total">${esc(r.total)}</div>
    <div class="parts">${esc(r.detail)}</div>
    ${r.plot ? `<div class="plot ${r.plot.cls}">Plot die ${r.plot.value} — ${r.plot.label}</div>` : ''}
  </div>`).join('');
}

function rollTest(label, modifier){
  const mode = state.settings.diceMode;
  if (mode === 'disabled') return;
  if (mode === 'info'){
    logRoll({
      what: label,
      total: `1d20 ${sgn(modifier)}`,
      detail: `Roll a d20 and add ${sgn(modifier)}.${state.settings.plotDie ? ' Also roll a d6 plot die.' : ''}`
    });
    return;
  }
  const die = rollDie(20);
  const entry = {
    what: label,
    total: String(die + modifier),
    detail: `d20 [${die}] ${sgn(modifier)}${die === 20 ? ' — natural 20' : die === 1 ? ' — natural 1' : ''}`
  };
  if (state.settings.plotDie) entry.plot = plotDie();
  logRoll(entry);
}

function rollWeapon(i){
  const mode = state.settings.diceMode;
  if (mode === 'disabled') return;
  const c = activeChar(), d = derive(c), w = c.weapons[i];
  if (!w) return;
  const mod = (d.skills[w.skill] || 0) + (w.bonus | 0);
  if (mode === 'info'){
    logRoll({
      what: `${w.name || 'Weapon'} — attack vs ${w.defense} defense`,
      total: `1d20 ${sgn(mod)}`,
      detail: `Roll a d20 and add ${sgn(mod)} to hit. On a hit, roll damage: ${w.damage || '1d6'}.${state.settings.plotDie ? ' Also roll a d6 plot die.' : ''}`
    });
    return;
  }
  const die = rollDie(20);
  const dmg = parseDice(expandAttrs(w.damage || '1d6', c));
  const entry = {
    what: `${w.name || 'Weapon'} — attack vs ${w.defense} defense`,
    total: `${die + mod} to hit · ${dmg.total} damage`,
    detail: `d20 [${die}] ${sgn(mod)} · damage ${w.damage || '1d6'} = ${dmg.detail}`
  };
  if (state.settings.plotDie) entry.plot = plotDie();
  logRoll(entry);
}

/* ---------- rests ---------- */
function shortRest(){
  const c = activeChar(), d = derive(c);
  const die = parseInt(d.recovery.slice(1), 10);
  const roll = rollDie(die) + c.attributes.wil;
  c.health.current = clamp(c.health.current + roll, 0, d.maxHealth);
  c.focus.current = d.maxFocus;
  logRoll({what:`${c.name} takes a short rest`, total:`+${roll} health`,
           detail:`Recovery ${d.recovery} + WIL, focus restored to ${d.maxFocus}`});
  render();
  save();
  toast(`Recovered ${roll} health. Focus is full.`);
}

function longRest(){
  const c = activeChar(), d = derive(c);
  c.health.current = d.maxHealth;
  c.focus.current = d.maxFocus;
  if (c.radiant) c.investiture.current = d.maxInvestiture;
  c.injuries.forEach(inj => inj.days = Math.max(0, (inj.days | 0) - 1));
  c.injuries = c.injuries.filter(inj => inj.days > 0 || !inj.text);
  ['Exhausted','Disoriented','Slowed','Stunned','Surprised','Prone'].forEach(k => delete c.conditions[k]);
  render();
  save();
  toast('Long rest complete. Pools are full and injuries advanced a day.');
}

/* ============================================================
   EXPERTISE COMBOBOX
   ============================================================ */
function bindCombo(){
  const input = $('#expinput'), menu = $('#expmenu');
  if (!input) return;
  let hl = -1, items = [];

  const flat = () => {
    const out = [];
    for (const g in EXPERTISES) EXPERTISES[g].forEach(n => out.push({name:n, group:g}));
    return out;
  };

  const open = () => {
    const q = input.value.trim().toLowerCase();
    const c = activeChar();
    const matches = flat().filter(x => !c.expertises.includes(x.name) && (!q || x.name.toLowerCase().includes(q)));
    items = matches.slice(0, 40);
    let html = '', lastGroup = '';
    items.forEach((x, i) => {
      if (x.group !== lastGroup){ html += `<div class="grp">${x.group}</div>`; lastGroup = x.group; }
      html += `<button data-exp="${esc(x.name)}" class="${i === hl ? 'hl' : ''}">${esc(x.name)}</button>`;
    });
    if (q && !flat().some(x => x.name.toLowerCase() === q))
      html = `<div class="grp">Custom</div><button data-exp="${esc(input.value.trim())}">Add “${esc(input.value.trim())}”</button>` + html;
    menu.innerHTML = html || '<div class="grp">Nothing left to add</div>';
    menu.hidden = false;
  };

  const close = () => { menu.hidden = true; hl = -1; };

  input.addEventListener('focus', open);
  input.addEventListener('input', () => { hl = -1; open(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      hl = clamp(hl + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1);
      open();
    } else if (e.key === 'Enter'){
      e.preventDefault();
      const pick = hl >= 0 && items[hl] ? items[hl].name : input.value.trim();
      if (pick) addExpertise(pick);
    } else if (e.key === 'Escape') close();
  });
  menu.addEventListener('mousedown', e => {
    const btn = e.target.closest('[data-exp]');
    if (btn){ e.preventDefault(); addExpertise(btn.dataset.exp); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
}

function addExpertise(name){
  const c = activeChar();
  name = name.trim();
  if (!name) return;
  if (c.expertises.includes(name)){ toast(`${name} is already on the sheet.`); return; }
  c.expertises.push(name);
  save();
  renderFront();
  syncDerived();
  const input = $('#expinput');
  if (input){ input.value = ''; input.focus(); }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('input', e => {
  const t = e.target;
  const path = t.dataset.path;
  if (path === undefined) return;
  const c = activeChar();
  let value = t.value;
  if (t.type === 'number'){
    value = t.value === '' ? 0 : parseInt(t.value, 10);
    if (Number.isNaN(value)) value = 0;
    if (path === 'level') value = clamp(value, 1, 20);
  }
  setPath(c, path, value);
  if (t.dataset.clamp){
    const d = derive(c);
    const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[t.dataset.clamp];
    const fixed = clamp(value, 0, max);
    if (fixed !== value){ setPath(c, path, fixed); t.value = fixed; }
  }
  if (t.dataset.renames) renderCharPicker();
  if (path.startsWith('spheres.') && path !== 'spheres.notes'){
    const el = $('#sphereTotal');
    if (el) el.textContent = sphereTotalText(c);
  }
  if (path === 'gearWeight'){
    const d = derive(c);
    const line = $('#weightline');
    if (line){
      line.textContent = weightLineText(c, d);
      line.style.color = (c.gearWeight | 0) > d.liftingLbs ? 'var(--warn)' : '';
    }
  }
  syncDerived();
  save();
});

document.addEventListener('click', e => {
  const c = activeChar();

  const tab = e.target.closest('.tab');
  if (tab) return switchTab(tab.dataset.tab);

  const pip = e.target.closest('[data-pips] i');
  if (pip){
    const path = pip.parentElement.dataset.pips;
    const rank = parseInt(pip.dataset.rank, 10);
    const current = getPath(c, path);
    setPath(c, path, current === rank ? rank - 1 : rank);
    renderFront(); syncDerived(); save();
    return;
  }

  const tick = e.target.closest('[data-ticks] i');
  if (tick){
    const gi = parseInt(tick.parentElement.dataset.ticks, 10);
    const ti = parseInt(tick.dataset.t, 10);
    c.goals[gi].ticks[ti] = !c.goals[gi].ticks[ti];
    tick.classList.toggle('on', c.goals[gi].ticks[ti]);
    save();
    return;
  }

  const idealTick = e.target.closest('[data-idealticks] i');
  if (idealTick){
    const ii = parseInt(idealTick.parentElement.dataset.idealticks, 10);
    const ti = parseInt(idealTick.dataset.t, 10);
    const ideal = c.spren.ideals[ii];
    ideal.ticks[ti] = !ideal.ticks[ti];
    idealTick.classList.toggle('on', ideal.ticks[ti]);
    save();
    return;
  }

  const attrBtn = e.target.closest('[data-attr]');
  if (attrBtn){
    const k = attrBtn.dataset.attr;
    c.attributes[k] = clamp(c.attributes[k] + parseInt(attrBtn.dataset.by, 10), 0, 9);
    const d = derive(c);
    ['health','focus','investiture'].forEach(kind => {
      const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[kind];
      c[kind].current = clamp(c[kind].current, 0, max);
      const field = $(`[data-path="${kind}.current"]`);
      if (field) field.value = c[kind].current;
    });
    syncDerived(); updatePointsSpent(); save();
    return;
  }

  const adj = e.target.closest('[data-adjust]');
  if (adj){
    const kind = adj.dataset.adjust, by = parseInt(adj.dataset.by, 10);
    const d = derive(c);
    const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[kind];
    c[kind].current = clamp(c[kind].current + by, 0, max);
    const field = $(`[data-path="${kind}.current"]`);
    if (field) field.value = c[kind].current;
    syncDerived(); save();
    return;
  }

  const cond = e.target.closest('[data-cond]');
  if (cond && !cond.dataset.action){
    const n = cond.dataset.cond;
    c.conditions[n] = !c.conditions[n];
    if (!c.conditions[n]) delete c.conditions[n];
    cond.setAttribute('aria-pressed', String(!!c.conditions[n]));
    save();
    return;
  }

  const toggle = e.target.closest('[data-toggle]');
  if (toggle){
    const k = toggle.dataset.toggle;
    c[k] = !c[k];
    toggle.setAttribute('aria-pressed', String(c[k]));
    if (k === 'radiant' && c[k]) c.investiture.current = derive(c).maxInvestiture;
    renderFront(); syncDerived(); save();
    return;
  }

  const test = e.target.closest('[data-test]');
  if (test){
    if (state.settings.diceMode === 'disabled') return;
    const key = test.dataset.test;
    if (key === 'recovery'){
      const d = derive(c);
      if (state.settings.diceMode === 'info'){
        logRoll({what:`${c.name} — recovery die`, total:`${d.recovery} ${sgn(c.attributes.wil)}`, detail:`Roll ${d.recovery} and add WIL ${sgn(c.attributes.wil)}.`});
        return;
      }
      const die = parseInt(d.recovery.slice(1), 10);
      const r = rollDie(die);
      logRoll({what:`${c.name} — recovery die`, total:String(r + c.attributes.wil), detail:`${d.recovery} [${r}] + WIL ${sgn(c.attributes.wil)}`});
    } else {
      const d = derive(c);
      const sk = ALL_SKILLS.find(s => s.key === key);
      const label = sk ? sk.name : (c.skills[key].name || 'Custom skill');
      rollTest(`${c.name} — ${label}`, d.skills[key]);
    }
    return;
  }

  const roll = e.target.closest('[data-roll]');
  if (roll){
    if (state.settings.diceMode !== 'enabled') return;
    const res = parseDice(roll.dataset.roll);
    const entry = {what:`Quick roll — ${roll.dataset.roll}`, total:String(res.total), detail:res.detail};
    if (state.settings.plotDie && roll.dataset.roll === '1d20') entry.plot = plotDie();
    logRoll(entry);
    return;
  }

  const act = e.target.closest('[data-action]');
  if (act) handleAction(act.dataset.action, act, c);
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pips] i, [data-ticks] i, [data-idealticks] i, [data-test], .vaultcard[role="button"]')){
    e.preventDefault();
    e.target.click();
  }
  if (e.key === 'Escape' && $('#overlay').classList.contains('open')) closeModal();
  if (e.key === 'Escape' && $('#rulesdrawer').classList.contains('open')) closeRules();
});

function handleAction(action, node, c){
  switch (action){
    case 'new-char': {
      const nc = newCharacter('New character');
      state.characters.push(nc);
      state.activeId = nc.id;
      render(); save();
      toast('New character created.');
      break;
    }
    case 'settings': openSettings(); break;
    case 'go-social': switchTab('social'); break;
    case 'go-home': switchTab('home'); break;
    case 'rules': openRules(); break;
    case 'close-rules': closeRules(); break;
    case 'auth-signin': localSignIn(val('auth-username'), val('auth-password')); break;
    case 'auth-register': localRegister(val('auth-username'), val('auth-password')); break;
    case 'auth-guest': continueAsGuest(); break;
    case 'sign-out-session': signOutSession(); break;
    case 'open-char': state.activeId = node.dataset.cid; switchTab('front'); break;
    case 'new-char-home': {
      const nc = newCharacter('New character');
      state.characters.push(nc);
      state.activeId = nc.id;
      switchTab('front');
      break;
    }
    case 'delete-char-home': deleteCharacterById(node.dataset.cid); break;
    case 'open-campaign': {
      state.activePartyId = node.dataset.pid;
      switchTab('social');
      break;
    }
    case 'create-campaign-home': createCampaignHome(val('homecampaignname')); break;
    case 'join-campaign-home': joinCampaignHome(val('joincode')); break;
    case 'short-rest': shortRest(); break;
    case 'long-rest': longRest(); break;
    case 'export': exportCharacter(c); break;
    case 'export-all': exportAll(); break;
    case 'import': $('#filein').click(); break;
    case 'add-weapon':
      c.weapons.push({name:'', skill:'lightWeapons', bonus:0, damage:'1d6', traits:'', defense:'physical'});
      renderFront(); save(); break;
    case 'del-weapon':
      c.weapons.splice(parseInt(node.dataset.i, 10), 1);
      renderFront(); save(); break;
    case 'roll-weapon': rollWeapon(parseInt(node.dataset.i, 10)); break;
    case 'add-injury': c.injuries.push({text:'', days:1}); renderFront(); save(); break;
    case 'del-injury': c.injuries.splice(parseInt(node.dataset.i, 10), 1); renderFront(); save(); break;
    case 'add-squire': c.squires.push({name:'', type:'Squire', notes:''}); renderFront(); save(); break;
    case 'del-squire': c.squires.splice(parseInt(node.dataset.i, 10), 1); renderFront(); save(); break;
    case 'add-fabrial': c.fabrials.push({name:'', type:'', maxCharge:10, charge:10, notes:''}); renderBack(); save(); break;
    case 'del-fabrial': c.fabrials.splice(parseInt(node.dataset.i, 10), 1); renderBack(); save(); break;
    case 'del-expertise': c.expertises.splice(parseInt(node.dataset.i, 10), 1); renderFront(); syncDerived(); save(); break;
    case 'add-goal': c.goals.push({text:'', ticks:[false,false,false]}); renderBack(); save(); break;
    case 'del-goal': c.goals.splice(parseInt(node.dataset.i, 10), 1); renderBack(); save(); break;
    case 'toggle-tray': {
      const tray = $('#tray');
      tray.classList.toggle('collapsed');
      $('#traytoggle').textContent = tray.classList.contains('collapsed') ? 'Show' : 'Hide';
      break;
    }
    case 'clear-log': state.rolls = []; renderRolls(); save(); break;
    case 'plot-only': { if (state.settings.diceMode !== 'enabled') break; const p = plotDie(); logRoll({what:'Plot die', total:String(p.value), detail:p.label, plot:p}); break; }
    case 'clear-sheet': {
      if (confirm('Clear every field on this character? This cannot be undone.')){
        const keep = c.id;
        const fresh = newCharacter('Unnamed Radiant');
        fresh.id = keep;
        state.characters = state.characters.map(x => x.id === keep ? fresh : x);
        closeModal(); render(); save();
        toast('Sheet cleared.');
      }
      break;
    }
    case 'reset-level': {
      c.level = 1;
      const d = derive(c);
      c.health.current = d.maxHealth; c.focus.current = d.maxFocus;
      closeModal(); render(); save();
      toast('Back to level 1.');
      break;
    }
    case 'delete-char': {
      if (state.characters.length === 1){ toast('Keep at least one character.'); break; }
      if (confirm(`Delete ${c.name}?`)){
        state.characters = state.characters.filter(x => x.id !== c.id);
        state.activeId = state.characters[0].id;
        closeModal(); render(); save();
      }
      break;
    }
    case 'duplicate-char': {
      const copy = JSON.parse(JSON.stringify(c));
      copy.id = uid(); copy.name = c.name + ' (copy)';
      state.characters.push(copy); state.activeId = copy.id;
      closeModal(); render(); save();
      break;
    }
    case 'save-firebase': saveFirebaseConfig(); break;
    case 'disconnect-firebase': cloud.disconnect(); break;
    case 'close-modal': closeModal(); break;
    default: handleSocialAction(action, node, c);
  }
}

/* ---------- import / export ---------- */
function download(filename, data){
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = s => (s || 'character').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function exportCharacter(c){ download(`${slug(c.name)}.json`, JSON.stringify({type:'radiant-sheet-character', character:c}, null, 2)); toast('Character file downloaded.'); }
function exportAll(){ download('radiant-sheet-all.json', JSON.stringify({type:'radiant-sheet-collection', characters:state.characters, profile:state.profile, localParties:state.localParties}, null, 2)); toast('All characters downloaded.'); }

$('#filein').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = data.characters ? data.characters : data.character ? [data.character] : Array.isArray(data) ? data : [data];
    let added = 0;
    incoming.forEach(ch => {
      if (!ch || !ch.attributes) return;
      ch.id = uid();
      migrate(ch);
      state.characters.push(ch);
      added++;
    });
    if (added){
      state.activeId = state.characters[state.characters.length - 1].id;
      render(); save();
      toast(added === 1 ? 'Character imported.' : `${added} characters imported.`);
    } else toast('That file has no character data in it.');
  } catch(err){
    toast('That file could not be read as a character sheet.');
  }
  e.target.value = '';
});

function ruleSection(title, items){
  return `<h5>${esc(title)}</h5>` + items.map(it =>

}
function renderRulesDrawer(q){
  q = (q || '').trim().toLowerCase();
  const body = $('#rulesbody');
  if (!body) return;
  const match = x => !q || x.name.toLowerCase().includes(q) || (x.desc || '').toLowerCase().includes(q);
  const sections = [];
  const skillItems = ALL_SKILLS.map(s => ({name:s.name, sub:ATTRS[s.attr].short, desc:SKILL_BLURBS[s.key] || ''})).filter(match);
  if (skillItems.length) sections.push(ruleSection('Skills', skillItems));
  const actionItems = COMBAT_ACTIONS.filter(match);
  if (actionItems.length) sections.push(ruleSection('Combat actions', actionItems));
  const condItems = CONDITIONS.map(n => ({name:n, desc:CONDITION_BLURBS[n] || ''})).filter(match);
  if (condItems.length) sections.push(ruleSection('Conditions', condItems));
  const surgeItems = SURGE_BLURBS.filter(match);
  if (surgeItems.length) sections.push(ruleSection('Surges', surgeItems));
  body.innerHTML = sections.join('') || '<p class="empty">No matches for that search.</p>';
}

/* ============================================================
   CLOUD — optional Firebase sync
   ============================================================ */
const cloud = {
  on:false, ready:false, app:null, auth:null, db:null, user:null,
  me:{username:'', friends:[], parties:[]}, requests:[], friendProfiles:[], parties:[],
  unsubs:[], lastPatchAt:0, pushTimer:null,

  async connect(){
    const cfg = state.settings.firebase;
    if (!cfg.apiKey || !cfg.projectId) return false;
    try {
      const [appMod, authMod, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      ]);
      this.fb = {...authMod, ...fsMod};
      this.app = appMod.initializeApp(cfg, 'radiant-sheet');
      this.auth = authMod.getAuth(this.app);
      this.db = fsMod.getFirestore(this.app);
      this.on = true;
      authMod.onAuthStateChanged(this.auth, user => {
        this.user = user;
        if (user) this.listen(); else this.stopListening();
        renderSocial();
        updateAccountChrome();
        setSavePill('saved');
      });
      return true;
    } catch(err){
      console.error(err);
      toast('Could not reach Firebase. Check the keys and your connection.');
      this.on = false;
      return false;
    }
  },

  disconnect(){
    this.stopListening();
    if (this.auth) this.fb.signOut(this.auth).catch(() => {});
    this.on = false; this.user = null;
    state.settings.firebase = {apiKey:'', authDomain:'', projectId:'', databaseURL:''};
    save(); closeModal(); renderSocial();
    toast('Disconnected. Sheets stay in this browser.');
  },

  async signUp(email, pw){
    try {
      await this.fb.createUserWithEmailAndPassword(this.auth, email, pw);
      toast('Account created. Pick a username next.');
    } catch(err){ toast(this.readable(err)); }
  },
  async signIn(email, pw){
    try { await this.fb.signInWithEmailAndPassword(this.auth, email, pw); }
    catch(err){ toast(this.readable(err)); }
  },
  async signOut(){ await this.fb.signOut(this.auth); this.me = {username:'', friends:[], parties:[]}; renderSocial(); },

  readable(err){
    const code = (err && err.code || '').replace('auth/', '');
    return {
      'invalid-email':'That email address is not valid.',
      'missing-password':'Enter a password.',
      'weak-password':'Use at least six characters for the password.',
      'email-already-in-use':'That email already has an account — sign in instead.',
      'invalid-credential':'Email or password did not match.',
      'operation-not-allowed':'Turn on email sign-in in your Firebase console.'
    }[code] || (err && err.message) || 'Something went wrong.';
  },

  doc(...p){ return this.fb.doc(this.db, ...p); },

  listen(){
    this.stopListening();
    const uidv = this.user.uid;
    this.unsubs.push(this.fb.onSnapshot(this.doc('users', uidv), snap => {
      this.me = Object.assign({username:'', friends:[], parties:[]}, snap.data() || {});
      this.loadFriendProfiles();
      this.watchParties();
      renderSocial();
      updateAccountChrome();
    }));
    this.unsubs.push(this.fb.onSnapshot(this.fb.collection(this.db, 'users', uidv, 'requests'), snap => {
      this.requests = snap.docs.map(d => ({id:d.id, ...d.data()}));
      renderSocial();
      updateAccountChrome();
    }));
  },

  stopListening(){ this.unsubs.forEach(u => { try{ u(); }catch(e){} }); this.unsubs = []; this.partyUnsubs = []; },

  async loadFriendProfiles(){
    const out = [];
    for (const fid of (this.me.friends || [])){
      try {
        const s = await this.fb.getDoc(this.doc('users', fid));
        if (s.exists()) out.push({uid:fid, username:s.data().username});
      } catch(e){}
    }
    this.friendProfiles = out;
    renderSocial();
  },

  watchParties(){
    (this.me.parties || []).forEach(pid => {
      if (this.parties.some(p => p.id === pid && p._watching)) return;
      const unsub = this.fb.onSnapshot(this.doc('parties', pid), snap => {
        if (!snap.exists()) return;
        const data = {id:snap.id, _watching:true, ...snap.data()};
        const i = this.parties.findIndex(p => p.id === snap.id);
        if (i >= 0) this.parties[i] = data; else this.parties.push(data);
        this.applyIncomingPatch(data);
        renderSocial();
      });
      this.unsubs.push(unsub);
      this.parties.push({id:pid, _watching:true, name:'…', members:{}});
    });
  },

  applyIncomingPatch(party){
    const mine = party.members && party.members[this.user.uid];
    if (!mine || !mine.patchedBy || mine.patchedBy === this.user.uid) return;
    if ((mine.patchedAt || 0) <= this.lastPatchAt) return;
    this.lastPatchAt = mine.patchedAt;
    const c = state.characters.find(x => x.id === mine.charId);
    if (!c || !mine.char) return;
    c.health.current = mine.char.health.current;
    c.focus.current = mine.char.focus.current;
    c.investiture.current = mine.char.investiture.current;
    c.conditions = mine.char.conditions || {};
    if (mine.char.goals) mine.char.goals.forEach((g, i) => { if (c.goals[i]) c.goals[i].ticks = g.ticks; });
    save(); render();
    toast(`${party.name}: your game master updated this sheet.`);
  },

  snapshot(c){
    const d = derive(c);
    return {
      id:c.id, name:c.name, level:c.level, tier:d.tier, paths:c.paths, ancestry:c.ancestry,
      health:{current:c.health.current, max:d.maxHealth},
      focus:{current:c.focus.current, max:d.maxFocus},
      investiture:{current:c.investiture.current, max:d.maxInvestiture, radiant:c.radiant},
      defenses:{physical:d.physicalDefense, cognitive:d.cognitiveDefense, spiritual:d.spiritualDefense},
      deflect:d.deflect, movement:d.movement,
      conditions:c.conditions || {},
      surges:(c.skills.custom_physical.name || '') + (c.skills.custom_spiritual.name ? ', ' + c.skills.custom_spiritual.name : ''),
      goals:(c.goals || []).map(g => ({text:g.text, ticks:g.ticks})),
      spren:(c.spren && c.spren.order) ? {name:c.spren.name, order:c.spren.order} : null
    };
  },

  pushCharacter(){
    if (!this.on || !this.user) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(async () => {
      const c = activeChar();
      for (const p of this.parties){
        const mine = p.members && p.members[this.user.uid];
        if (!mine || mine.charId !== c.id) continue;
        try {
          await this.fb.updateDoc(this.doc('parties', p.id), {
            [`members.${this.user.uid}.char`]: this.snapshot(c),
            [`members.${this.user.uid}.updatedAt`]: Date.now(),
            [`members.${this.user.uid}.patchedBy`]: this.user.uid,
            [`members.${this.user.uid}.patchedAt`]: Date.now()
          });
        } catch(e){ /* offline is fine — local copy still holds */ }
      }
    }, 900);
  }
};

function localRegister(username, password){
  username = (username || '').replace(/^@/, '').trim();
  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) return toast('Use 3–20 letters, numbers, or underscores for a username.');
  if (!password || password.length < 4) return toast('Use a password with at least 4 characters.');
  const accounts = loadAccounts();
  if (accounts[username.toLowerCase()]) return toast('That handle is already registered on this device.');
  accounts[username.toLowerCase()] = {username, password};
  saveAccounts(accounts);
  state.session = {mode:'local', username};
  state.profile.username = username;
  state.tab = 'home';
  switchView('main');
  toast(`Welcome, @${username}.`);
}
function localSignIn(username, password){
  username = (username || '').replace(/^@/, '').trim();
  const accounts = loadAccounts();
  const acc = accounts[username.toLowerCase()];
  if (!acc || acc.password !== password) return toast('Username or password did not match on this device.');
  state.session = {mode:'local', username:acc.username};
  state.profile.username = acc.username;
  state.tab = 'home';
  switchView('main');
  toast(`Welcome back, @${acc.username}.`);

function deleteCharacterById(id){

  if (!c || !confirm(`Delete ${c.name}?`)) return;
  state.characters = state.characters.filter(x => x.id !== id);
  if (state.activeId === id) state.activeId = state.characters[0].id;

}

function createCampaignHome(name){
  if (!name) return toast('Give the campaign a name.');
  if (cloud.on && cloud.user) return createParty(name);
  const p = {id:uid(), name, code:genCode(), gmName:state.profile.username || 'You', sessionDate:'', charIds:[]};
  state.localParties.push(p);
  state.activePartyId = p.id;
  renderHomeTab(); save();
  toast(`Campaign created. Join code: ${p.code}`);
}

async function joinCampaignHome(code){
  code = (code || '').trim();
  if (!/^\d{6}$/.test(code)) return toast('Enter the 6-digit join code.');
  if (cloud.on && cloud.user){
    try {
      const q = cloud.fb.query(cloud.fb.collection(cloud.db, 'parties'), cloud.fb.where('code', '==', code));
      const snap = await cloud.fb.getDocs(q);
      if (snap.empty) return toast('No campaign uses that code.');
      const partyDoc = snap.docs[0];
      await cloud.fb.updateDoc(partyDoc.ref, {
        memberUids:cloud.fb.arrayUnion(cloud.user.uid),
        [`members.${cloud.user.uid}`]:{username:cloud.me.username, role:'Player', charId:'', char:null, updatedAt:Date.now()}
      });
      await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {parties:cloud.fb.arrayUnion(partyDoc.id)}, {merge:true});
      state.activePartyId = partyDoc.id;
      toast('Joined the campaign.');
      renderHomeTab();
    } catch(err){ toast('Could not join: ' + err.message); }
    return;
  }
  const p = state.localParties.find(x => x.code === code);

  toast(`Joined ${p.name}.`);
}

function memberCardHTML(m, uidKey, opts){
  opts = opts || {};
  const ch = m.char || {};
  const isGM = !!opts.isGM, isSelf = uidKey === opts.viewerUid;
  if (!isGM && !isSelf && opts.party && opts.party.visibility !== 'all'){
    return `<div class="member"><h4>${esc(m.username || 'Player')}</h4><p class="empty">This player's sheet is set to private.</p></div>`;
  }
  if (!isGM && !isSelf && m.hidden){
    return `<div class="member"><h4>${esc(m.username || 'Player')}</h4><p class="empty">Hidden by the game master.</p></div>`;
  }
  const canSeeSecrets = isGM || isSelf || !m.hideSecrets;
  const conds = Object.keys(ch.conditions || {}).filter(k => ch.conditions[k]);
  const bar = (cur, max) => `<div class="bar"><i style="width:${max ? clamp(cur / max * 100, 0, 100) : 0}%"></i></div>`;
  const line = (label, kind, cur, max) => `<div class="track" style="margin-top:.35rem">
      ${opts.canEdit ? `<button data-action="${opts.scope}-adjust" data-uid="${uidKey}" data-kind="${kind}" data-by="-1" aria-label="Lower ${label}">−</button>` : ''}
      <div style="flex:1;font-size:.8rem">${label}
        <b style="font-family:'Cormorant Garamond',serif;font-size:1.1rem">${cur}</b>
        <span class="of">/ ${max}</span>${bar(cur, max)}</div>
      ${opts.canEdit ? `<button data-action="${opts.scope}-adjust" data-uid="${uidKey}" data-kind="${kind}" data-by="1" aria-label="Raise ${label}">+</button>` : ''}
    </div>`;

  const goals = (ch.goals || []).filter(g => g.text).map((g, gi) => `<div class="goal" style="padding:.2rem 0">
      <span style="font-size:.8rem">${esc(g.text)}</span>
      <span class="ticks">${[0,1,2].map(t => `<i class="${g.ticks[t] ? 'on' : ''}" ${opts.canEdit ? `data-action="${opts.scope}-goal" data-uid="${uidKey}" data-g="${gi}" data-t="${t}" role="button" tabindex="0"` : ''}></i>`).join('')}</span>
    </div>`).join('');

  return `<div class="member">
    <h4>${esc(ch.name || 'No character assigned')}</h4>
    <div class="sub">${esc(m.username || '')}${m.role ? ` · <span class="badge">${esc(m.role)}</span>` : ''}
      ${ch.level ? ` · Level ${ch.level} ${esc(ch.paths || '')}` : ''}</div>
    ${ch.name ? `
      ${line('Health', 'health', ch.health.current, ch.health.max)}
      ${line('Focus', 'focus', ch.focus.current, ch.focus.max)}
      ${ch.investiture && ch.investiture.radiant ? line('Investiture', 'investiture', ch.investiture.current, ch.investiture.max) : ''}
      <div class="defs">
        <div><div class="v">${ch.defenses.physical}</div><div class="l">Phys</div></div>
        <div><div class="v">${ch.defenses.cognitive}</div><div class="l">Cog</div></div>
        <div><div class="v">${ch.defenses.spiritual}</div><div class="l">Spir</div></div>
        <div><div class="v">${ch.deflect}</div><div class="l">Deflect</div></div>
      </div>
      ${ch.surges && ch.surges.trim() ? `<div class="sub">Surges: ${esc(ch.surges)}</div>` : ''}
      ${ch.spren ? (canSeeSecrets
        ? `<div class="sub">${esc(ch.spren.order)}${ch.spren.name ? ' · bonded to ' + esc(ch.spren.name) : ''}</div>`
        : `<div class="sub">Radiant order — <i>kept secret</i></div>`) : ''}
      <div class="conds" style="margin-top:.3rem">
        ${(opts.canEdit ? CONDITIONS : conds).map(n => `<button class="cond" ${opts.canEdit ? `data-action="${opts.scope}-cond" data-uid="${uidKey}" data-cond="${n}"` : ''} aria-pressed="${conds.includes(n)}">${n}</button>`).join('') || '<span class="empty">No conditions</span>'}
      </div>
      ${goals ? `<hr class="rule" style="margin:.6rem 0 .3rem">${goals}` : ''}
    ` : '<p class="empty">Waiting for this player to pick a character.</p>'}
  </div>`;
}
