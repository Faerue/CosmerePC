/* ---------- social actions ---------- */
function handleSocialAction(action, node, c){
  const val = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
  const pid = node.dataset.pid;

  switch (action){
    /* local parties */
    case 'create-local-party': {
      const name = val('localpartyname');
      if (!name) return toast('Give the party a name.');
      const p = {id:uid(), name, code:genCode(), gmName:state.profile.username || (state.session && state.session.username) || 'You', sessionDate:'', charIds:[]};
      state.localParties.push(p);
      state.activePartyId = p.id;
      renderSocial(); save();
      toast(`Campaign created. Join code: ${p.code}`);
      break;
    }
    case 'select-local-party': state.activePartyId = pid; renderSocial(); break;
    case 'del-local-party':
      state.localParties = state.localParties.filter(p => p.id !== pid);
      renderSocial(); save(); break;
    case 'add-local-char': {
      const p = state.localParties.find(x => x.id === pid);
      const cid = val('localcharpick') || ($('#localcharpick') && $('#localcharpick').value);
      if (p && cid && !p.charIds.includes(cid)){ p.charIds.push(cid); renderSocial(); save(); }
      else toast('That character is already at the table.');
      break;
    }
    case 'local-adjust': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      if (!target) break;
      const kind = node.dataset.kind, by = parseInt(node.dataset.by, 10);
      const d = derive(target);
      const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[kind];
      target[kind].current = clamp(target[kind].current + by, 0, max);
      renderSocial(); save(); break;
    }
    case 'local-cond': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      if (!target) break;
      const n = node.dataset.cond;
      target.conditions[n] = !target.conditions[n];
      if (!target.conditions[n]) delete target.conditions[n];
      renderSocial(); save(); break;
    }
    case 'local-goal': {
      const target = state.characters.find(x => x.id === node.dataset.uid);
      const g = target && target.goals[parseInt(node.dataset.g, 10)];
      if (!g) break;
      const t = parseInt(node.dataset.t, 10);
      g.ticks[t] = !g.ticks[t];
      renderSocial(); save(); break;
    }

    /* auth */
    case 'sign-in': cloud.signIn(val('authemail'), val('authpw')); break;
    case 'sign-up': cloud.signUp(val('authemail'), val('authpw')); break;
    case 'sign-out': cloud.signOut(); break;
    case 'claim-username': claimUsername(val('unameinput')); break;

    /* friends */
    case 'send-request': sendFriendRequest(val('friendinput')); break;
    case 'accept-request': acceptRequest(node.dataset.uid); break;
    case 'decline-request': declineRequest(node.dataset.uid); break;

    /* parties */
    case 'create-party': createParty(val('partyname')); break;
    case 'select-party': state.activePartyId = pid; renderSocial(); break;
    case 'party-add': partyAdd(pid, val('partyadd')); break;
    case 'leave-party': leaveParty(pid); break;
    case 'party-adjust': partyPatch(node, m => {
      const kind = node.dataset.kind, by = parseInt(node.dataset.by, 10);
      m.char[kind].current = clamp(m.char[kind].current + by, 0, m.char[kind].max);
    }); break;
    case 'party-cond': partyPatch(node, m => {
      const n = node.dataset.cond;
      m.char.conditions = m.char.conditions || {};
      if (m.char.conditions[n]) delete m.char.conditions[n]; else m.char.conditions[n] = true;
    }); break;
    case 'party-goal': partyPatch(node, m => {
      const g = m.char.goals[parseInt(node.dataset.g, 10)];
      const t = parseInt(node.dataset.t, 10);
      g.ticks[t] = !g.ticks[t];
    }); break;
  }
}

document.addEventListener('change', e => {
  const sel = e.target.closest('[data-change="assign-char"]');
  if (sel){ assignCharacter(sel.dataset.pid, sel.value); return; }

  const localDate = e.target.closest('#localsessiondate');
  if (localDate){
    const p = state.localParties.find(x => x.id === localDate.dataset.pid);
    if (p){ p.sessionDate = localDate.value; save(); renderHomeTab(); }
    return;
  }
  const cloudDate = e.target.closest('#partysessiondate');
  if (cloudDate){
    const party = cloud.parties.find(x => x.id === cloudDate.dataset.pid);
    if (party) party.sessionDate = cloudDate.value;
    cloud.fb.updateDoc(cloud.doc('parties', cloudDate.dataset.pid), {sessionDate:cloudDate.value}).catch(() => {});
    return;
  }
  const visctl = e.target.closest('[data-visctl]');
  if (visctl){
    const field = visctl.dataset.visctl, mUid = visctl.dataset.uid, pid = visctl.dataset.pid;
    const party = cloud.parties.find(p => p.id === pid);
    if (party && party.members[mUid]) party.members[mUid][field] = visctl.checked;
    cloud.fb.updateDoc(cloud.doc('parties', pid), {[`members.${mUid}.${field}`]:visctl.checked}).catch(() => {});
    return;
  }
});

document.addEventListener('click', e => {
  const visg = e.target.closest('[data-visglobal]');
  if (!visg) return;
  const pid = visg.dataset.visglobal;
  const party = cloud.parties.find(p => p.id === pid);
  if (!party) return;
  const next = party.visibility === 'all' ? 'own' : 'all';
  party.visibility = next;
  visg.setAttribute('aria-pressed', String(next === 'all'));
  cloud.fb.updateDoc(cloud.doc('parties', pid), {visibility:next}).catch(() => {});
});

/* ---------- firestore operations ---------- */
async function claimUsername(raw){
  const name = raw.replace(/^@/, '').trim();
  if (!/^[A-Za-z0-9_]{3,20}$/.test(name)) return toast('Use 3–20 letters, numbers, or underscores.');
  const lower = name.toLowerCase();
  try {
    const taken = await cloud.fb.getDoc(cloud.doc('usernames', lower));
    if (taken.exists() && taken.data().uid !== cloud.user.uid) return toast('That handle is taken.');
    await cloud.fb.setDoc(cloud.doc('usernames', lower), {uid:cloud.user.uid, username:name});
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid),
      {username:name, usernameLower:lower, friends:cloud.me.friends || [], parties:cloud.me.parties || []}, {merge:true});
    toast(`You are @${name}.`);
  } catch(err){ toast('Could not save that handle: ' + err.message); }
}

async function lookupUser(handle){
  const lower = handle.replace(/^@/, '').trim().toLowerCase();
  if (!lower) return null;
  const snap = await cloud.fb.getDoc(cloud.doc('usernames', lower));
  return snap.exists() ? snap.data() : null;
}

async function sendFriendRequest(handle){
  try {
    const target = await lookupUser(handle);
    if (!target) return toast('No one is using that handle.');
    if (target.uid === cloud.user.uid) return toast('That is you.');
    await cloud.fb.setDoc(cloud.doc('users', target.uid, 'requests', cloud.user.uid),
      {username:cloud.me.username, at:Date.now()});
    toast(`Request sent to @${target.username}.`);
  } catch(err){ toast('Request failed: ' + err.message); }
}

async function acceptRequest(fromUid){
  try {
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {friends:cloud.fb.arrayUnion(fromUid)}, {merge:true});
    await cloud.fb.setDoc(cloud.doc('users', fromUid), {friends:cloud.fb.arrayUnion(cloud.user.uid)}, {merge:true});
    await cloud.fb.deleteDoc(cloud.doc('users', cloud.user.uid, 'requests', fromUid));
    toast('Friend added.');
  } catch(err){ toast('Could not accept: ' + err.message); }
}
async function declineRequest(fromUid){
  try { await cloud.fb.deleteDoc(cloud.doc('users', cloud.user.uid, 'requests', fromUid)); }
  catch(err){ toast('Could not decline: ' + err.message); }
}

async function createParty(name){
  if (!name) return toast('Give the party a name.');
  try {
    const c = activeChar();
    const ref = await cloud.fb.addDoc(cloud.fb.collection(cloud.db, 'parties'), {
      name, gm:cloud.user.uid, code:genCode(), sessionDate:'', visibility:'own', memberUids:[cloud.user.uid],
      members:{[cloud.user.uid]:{username:cloud.me.username, role:'GM', charId:c.id, char:cloud.snapshot(c), updatedAt:Date.now()}}
    });
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {parties:cloud.fb.arrayUnion(ref.id)}, {merge:true});
    state.activePartyId = ref.id;
    renderHomeTab(); renderSocial();
    toast('Campaign created. You are the game master.');
  } catch(err){ toast('Could not create the party: ' + err.message); }
}

async function partyAdd(pid, handle){
  try {
    const target = await lookupUser(handle);
    if (!target) return toast('No one is using that handle.');
    await cloud.fb.updateDoc(cloud.doc('parties', pid), {
      memberUids:cloud.fb.arrayUnion(target.uid),
      [`members.${target.uid}`]:{username:target.username, role:'Player', charId:'', char:null, updatedAt:Date.now()}
    });
    await cloud.fb.setDoc(cloud.doc('users', target.uid), {parties:cloud.fb.arrayUnion(pid)}, {merge:true});
    toast(`@${target.username} added.`);
  } catch(err){ toast('Could not add them: ' + err.message); }
}

async function assignCharacter(pid, charId){
  const c = state.characters.find(x => x.id === charId);
  if (!c) return;
  try {
    await cloud.fb.updateDoc(cloud.doc('parties', pid), {
      [`members.${cloud.user.uid}.charId`]:charId,
      [`members.${cloud.user.uid}.char`]:cloud.snapshot(c),
      [`members.${cloud.user.uid}.patchedBy`]:cloud.user.uid,
      [`members.${cloud.user.uid}.updatedAt`]:Date.now()
    });
    toast(`${c.name} is now your character in this party.`);
  } catch(err){ toast('Could not assign: ' + err.message); }
}

async function leaveParty(pid){
  try {
    await cloud.fb.updateDoc(cloud.doc('parties', pid), {memberUids:cloud.fb.arrayRemove(cloud.user.uid)});
    await cloud.fb.setDoc(cloud.doc('users', cloud.user.uid), {parties:cloud.fb.arrayRemove(pid)}, {merge:true});
    cloud.parties = cloud.parties.filter(p => p.id !== pid);
    state.activePartyId = null;
    renderSocial();
    toast('You left the party.');
  } catch(err){ toast('Could not leave: ' + err.message); }
}

async function partyPatch(node, mutate){
  const party = cloud.parties.find(p => p.members && p.members[node.dataset.uid]);
  if (!party) return;
  const m = JSON.parse(JSON.stringify(party.members[node.dataset.uid]));
  if (!m.char) return;
  mutate(m);
  try {
    await cloud.fb.updateDoc(cloud.doc('parties', party.id), {
      [`members.${node.dataset.uid}.char`]:m.char,
      [`members.${node.dataset.uid}.patchedBy`]:cloud.user.uid,
      [`members.${node.dataset.uid}.patchedAt`]:Date.now()
    });
    if (node.dataset.uid === cloud.user.uid){
      const own = state.characters.find(x => x.id === m.charId);
      if (own){
        own.health.current = m.char.health.current;
        own.focus.current = m.char.focus.current;
        own.investiture.current = m.char.investiture.current;
        own.conditions = m.char.conditions || {};
        (m.char.goals || []).forEach((g, i) => { if (own.goals[i]) own.goals[i].ticks = g.ticks; });
        save();
      }
    }
  } catch(err){ toast('Change did not save: ' + err.message); }
}

load();
applySettings();
switchView(state.session ? 'main' : 'auth');
if (state.settings.firebase.apiKey && state.settings.firebase.projectId) cloud.connect();
setSavePill('saved');
</script>
