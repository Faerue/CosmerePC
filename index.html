<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2220%22%20fill%3D%22%23FAF8F5%22/%3E%3Cpath%20d%3D%22M50%2015%2058%2038%2081%2046%2058%2054%2050%2077%2042%2054%2019%2046%2042%2038Z%22%20fill%3D%22url%28%23g%29%22/%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%22100%22%20y2%3D%22100%22%3E%3Cstop%20stop-color%3D%22%23C88A8A%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23D4A373%22/%3E%3C/linearGradient%3E%3C/defs%3E%3C/svg%3E">
<meta name="theme-color" content="#C88A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radiant Sheet">
<style>
:root{
  --bg:#FAF8F5;
  --bg-2:#F3EEE9;
  --card:rgba(255,255,255,.88);
  --card-solid:#FFFDFB;
  --ink:#2D2438;
  --ink-soft:#6B5F76;
  --ink-faint:#9A8FA3;
  --accent:#C88A8A;
  --accent-2:#D4A373;
  --border:#E8C5C8;
  --border-soft:#EFE2E0;
  --field:#FFFFFF;
  --shadow:0 1px 2px rgba(45,36,56,.04), 0 12px 28px -18px rgba(45,36,56,.28);
  --ok:#7C9A80;
  --warn:#C77B5A;
  --radius:16px;
  --fs:1rem;
}
[data-theme="dark"]{
  --bg:#16151D;
  --bg-2:#1C1A25;
  --card:rgba(34,31,45,.92);
  --card-solid:#221F2D;
  --ink:#F0EDF5;
  --ink-soft:#B7AFC4;
  --ink-faint:#7E7590;
  --accent:#E0A9A9;
  --accent-2:#E3BC8E;
  --border:#3A3348;
  --border-soft:#2C2739;
  --field:#1A1824;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 34px -22px rgba(0,0,0,.9);
  --ok:#8FB894;
  --warn:#E09A76;
}
html[data-scale="s"]{--fs:.9rem}
html[data-scale="m"]{--fs:1rem}
html[data-scale="l"]{--fs:1.12rem}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:var(--fs);
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 82% -12%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
    radial-gradient(900px 500px at 8% 4%, color-mix(in srgb, var(--accent-2) 12%, transparent), transparent 65%),
    var(--bg);
  background-attachment:fixed;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
  padding:.55rem clamp(.6rem,2vw,1.4rem);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--border-soft);
}
.brand{display:flex;align-items:baseline;gap:.5rem;margin-right:.2rem}
button.brand{cursor:pointer}
button.brand:hover b{color:var(--accent)}
.brand .glyph{width:22px;height:22px;flex:0 0 auto;align-self:center}
.brand b{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;letter-spacing:.02em}
.brand span{font-size:.68rem;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
.spacer{flex:1 1 auto}
select.charpick{
  background:var(--field);border:1px solid var(--border);border-radius:999px;
  padding:.4rem .9rem;max-width:44vw;
}
.pill{
  display:inline-flex;align-items:center;gap:.4rem;
  border:1px solid var(--border);border-radius:999px;padding:.36rem .8rem;
  background:var(--card);font-size:.86rem;transition:border-color .15s,background .15s;
}
.pill:hover{border-color:var(--accent)}
.pill.tier{border-style:dashed;color:var(--ink-soft)}
.pill.saved{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.icon{padding:.36rem .5rem}
.avatarchip{padding:.22rem}
.avatar-mini{
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:.72rem;font-weight:700;
  font-family:'Cormorant Garamond',serif;overflow:hidden;background-size:cover;background-position:center;
}
[data-theme="dark"] .avatar-mini{color:#1A1824}
.avatar-lg{
  width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:2.1rem;font-weight:700;
  font-family:'Cormorant Garamond',serif;overflow:hidden;background-size:cover;background-position:center;
  border:3px solid var(--card-solid);box-shadow:var(--shadow);
}
[data-theme="dark"] .avatar-lg{color:#1A1824}
.profile-stats{display:flex;gap:1.2rem;justify-content:center;margin:.7rem 0 .2rem}
.profile-stats div{text-align:center}
.profile-stats b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.4rem}
.profile-stats span{font-size:.68rem;color:var(--ink-faint);letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.pending{background:var(--accent-2)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:.2rem;padding:.5rem clamp(.6rem,2vw,1.4rem) 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;padding:.5rem .9rem;border-radius:10px 10px 0 0;
  color:var(--ink-soft);font-size:.92rem;font-weight:500;border-bottom:2px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--card)}

main{padding:.9rem clamp(.6rem,2vw,1.4rem) 5rem;max-width:1500px;margin:0 auto}

/* ---------- cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:.9rem 1rem 1rem;
  margin-bottom:.9rem;
}
.card > h3{
  font-size:1.18rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  margin-bottom:.15rem;
}
.card > h3 + .rule{margin-bottom:.7rem}
.rule{height:1px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent-2) 70%,transparent) 38%,transparent 92%);border:0;margin:.2rem 0 .6rem}
.hint{font-size:.76rem;color:var(--ink-faint);font-weight:400}

/* identity header */
.identity{display:grid;grid-template-columns:2fr 1.4fr 1fr .7fr;gap:.7rem}
.identity .f:nth-child(1){grid-column:span 2}
@media(max-width:820px){.identity{grid-template-columns:1fr 1fr}.identity .f:nth-child(1){grid-column:span 2}}

.turnspeed{
  display:inline-flex;align-items:center;justify-content:center;width:100%;
  height:2.5rem;border-radius:10px;border:1px solid var(--border);background:var(--field);cursor:pointer;
}
.turnspeed svg{display:block}
.turnspeed polygon{fill:var(--ink-soft)}
.turnspeed-fast{background:linear-gradient(135deg,#D9A867,#F2D9AE);border-color:transparent}
.turnspeed-fast polygon{fill:#fff}
.turnspeed-slow{background:linear-gradient(135deg,#5B84B1,#9CC2E8);border-color:transparent}
.turnspeed-slow polygon{fill:#fff}
.f{display:flex;flex-direction:column;gap:.25rem}
.f > label{font-size:.72rem;color:var(--ink-faint);letter-spacing:.06em}
input[type=text],input[type=number],input[type=password],input[type=email],textarea,select{
  background:var(--field);border:1px solid var(--border-soft);border-radius:10px;
  padding:.45rem .6rem;width:100%;transition:border-color .15s, box-shadow .15s;
}
input:hover,textarea:hover,select:hover{border-color:var(--border)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{resize:vertical;min-height:5.5rem;line-height:1.55}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- realms ---------- */
.realms{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;align-items:start}
@media(max-width:1000px){.realms{grid-template-columns:1fr}}
.realm{padding-top:.8rem}
.realm-head{text-align:center;margin-bottom:.5rem}
.realm-head h2{font-size:1.5rem;font-variant:small-caps;letter-spacing:.06em}
.realm-head p{margin:.05rem 0 0;font-size:.73rem;color:var(--ink-faint)}
.trio{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center}
.attr{
  text-align:center;border:1px solid var(--border);border-radius:12px;background:var(--card-solid);
  padding:.4rem .3rem .5rem;
}
.attr .nm{font-size:.7rem;color:var(--ink-soft);letter-spacing:.08em}
.attr .stepper{display:flex;align-items:center;justify-content:center;gap:.35rem;margin-top:.1rem}
.attr .stepper button{width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid var(--border-soft);color:var(--ink-soft);line-height:1}
.attr .stepper button:hover{border-color:var(--accent);color:var(--accent)}
.attr .val{font-family:'Cormorant Garamond',serif;font-size:1.85rem;font-weight:600;min-width:1.4rem}
.shield{
  width:78px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,transparent),color-mix(in srgb,var(--accent-2) 16%,transparent));
  border:1px solid var(--border);
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);
  padding-bottom:.9rem;
}
.shield .lbl{font-size:.6rem;letter-spacing:.1em;color:var(--ink-soft)}
.shield .num{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;line-height:1}
.defbonus{width:64px;margin:.15rem auto 0}
.defbonus input{text-align:center;padding:.15rem;font-size:.74rem}

/* pools */
.pool{border:1px solid var(--border-soft);border-radius:12px;background:var(--card-solid);padding:.5rem .6rem;margin-top:.6rem}
.pool .top{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.pool .top b{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600}
.pool .top small{color:var(--ink-faint);font-size:.72rem}
.track{display:flex;align-items:center;gap:.4rem;margin-top:.35rem}
.track button{width:1.9rem;height:1.9rem;border-radius:9px;border:1px solid var(--border);color:var(--ink-soft)}
.track button:hover{border-color:var(--accent);color:var(--accent)}
.track input{text-align:center;font-size:1.1rem;font-weight:600;padding:.25rem}
.track .of{color:var(--ink-faint);font-size:.9rem}
.track .max{font-family:'Cormorant Garamond',serif;font-size:1.35rem;min-width:1.6rem;text-align:center}
.bar{height:5px;border-radius:99px;background:var(--border-soft);margin-top:.4rem;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

/* skills */
.skill{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.5rem;align-items:center;padding:.22rem 0;border-bottom:1px dotted var(--border-soft)}
.skill:last-child{border-bottom:0}
.skill .mod{
  text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;
  border:1px solid var(--border);border-radius:9px;background:var(--card-solid);padding:.1rem 0;cursor:pointer;
}
.skill .mod:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card-solid))}
.skill .nm{font-size:.88rem}
.skill .nm .at{color:var(--ink-faint);font-size:.74rem}
.skill .nm input{padding:.2rem .4rem;font-size:.84rem}
.pips{display:flex;gap:.22rem}
.pips i{
  width:.82rem;height:.82rem;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;display:block;
  transition:background .12s,border-color .12s;
}
.pips i.on{background:linear-gradient(150deg,var(--accent),var(--accent-2));border-color:transparent}
.customline{display:grid;grid-template-columns:1fr 4.2rem;gap:.3rem}

/* lookups */
.lookups{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;text-align:center}
@media(max-width:700px){.lookups{grid-template-columns:repeat(2,1fr)}}
.lookup{border:1px solid var(--border-soft);border-radius:12px;padding:.5rem;background:var(--card-solid)}
.lookup .lbl{font-size:.68rem;color:var(--ink-faint);letter-spacing:.07em}
.lookup .v{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600}

/* generic rows/tables */
.rows{display:flex;flex-direction:column;gap:.4rem}
.row{display:grid;gap:.35rem;align-items:center}
.wrow{grid-template-columns:1.4fr 1fr .8fr 1.1fr 1fr auto auto}
@media(max-width:900px){.wrow{grid-template-columns:1fr 1fr}}
.thead{font-size:.7rem;color:var(--ink-faint);letter-spacing:.05em;padding-left:.2rem}
@media(max-width:900px){.thead{display:none}}
.iconbtn{border:1px solid var(--border-soft);border-radius:9px;padding:.35rem .55rem;color:var(--ink-soft);font-size:.85rem}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--border);border-radius:999px;padding:.42rem .95rem;background:var(--card-solid);font-size:.87rem;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
[data-theme="dark"] .btn.primary{color:#1A1824}
.btn.primary:hover{filter:brightness(1.05);color:#fff}
[data-theme="dark"] .btn.primary:hover{color:#1A1824}
.btn.ghost{background:none}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.addbtn{margin-top:.5rem}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.5rem;min-height:1.9rem}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;
  border:1px solid var(--border);border-radius:999px;padding:.22rem .4rem .22rem .7rem;
  background:color-mix(in srgb,var(--accent) 9%,var(--card-solid));
}
.chip button{color:var(--ink-faint);font-size:.95rem;line-height:1;padding:0 .15rem}
.chip button:hover{color:var(--warn)}
.chip .kind{font-size:.62rem;color:var(--ink-faint);letter-spacing:.06em}
.chip.temporary{background:color-mix(in srgb,var(--accent-2) 22%,var(--card-solid));border-style:dashed;border-color:var(--accent-2)}
.chip.temporary .kind{color:var(--accent-2)}
.combo{position:relative}
.combo .menu{
  position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:240px;overflow:auto;
  background:var(--card-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:.25rem;
}
/* .card has backdrop-filter, which creates its own stacking context — that traps the
   dropdown's z-index inside it, so a later sibling .card still paints on top. Lifting
   the whole card above its siblings while a menu inside it is open fixes that. */
.card:has(.menu:not([hidden])){ position:relative; z-index:25; }
.combo .menu button{display:block;width:100%;text-align:left;padding:.34rem .55rem;border-radius:8px;font-size:.85rem}
.combo .menu button:hover,.combo .menu button.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.combo .menu .grp{font-size:.66rem;color:var(--ink-faint);letter-spacing:.1em;padding:.35rem .55rem .15rem}
.slots{font-size:.76rem;color:var(--ink-faint)}
.slots b{color:var(--accent)}

/* conditions */
.conds{display:flex;flex-wrap:wrap;gap:.3rem}
.cond{border:1px solid var(--border-soft);border-radius:999px;padding:.22rem .65rem;font-size:.78rem;color:var(--ink-soft)}
.cond[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
[data-theme="dark"] .cond[aria-pressed="true"]{color:#1A1824}

/* goals */
.goal{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center}
.ticks{display:flex;gap:.3rem}
.ticks i{width:1rem;height:1rem;border-radius:50%;border:1.5px solid var(--border);cursor:pointer;display:block}
.ticks i.on{background:linear-gradient(150deg,var(--accent),var(--accent-2));border-color:transparent}

/* back page */
.back-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem;align-items:start}
@media(max-width:1000px){.back-grid{grid-template-columns:1fr}}

/* party */
.party-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.9rem}
.member{border:1px solid var(--border-soft);border-radius:14px;background:var(--card-solid);padding:.75rem .85rem}
.member h4{font-size:1.15rem}
.member .sub{font-size:.74rem;color:var(--ink-faint);margin-bottom:.4rem}
.member .defs{display:flex;gap:.4rem;margin:.5rem 0}
.member .defs div{flex:1;text-align:center;border:1px solid var(--border-soft);border-radius:9px;padding:.2rem}
.member .defs .v{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600}
.member .defs .l{font-size:.6rem;color:var(--ink-faint)}
.badge{display:inline-block;font-size:.64rem;letter-spacing:.08em;border:1px solid var(--border);border-radius:999px;padding:.05rem .5rem;color:var(--accent)}
.badge-overburdened{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:.2rem .7rem;color:#fff;background:var(--warn)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;align-items:start}
@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.listitem{display:flex;align-items:center;justify-content:space-between;gap:.5rem;border-bottom:1px solid var(--border-soft);padding:.42rem 0}
.listitem:last-child{border-bottom:0}
.empty{color:var(--ink-faint);font-size:.85rem;padding:.5rem 0}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;
  background:color-mix(in srgb,var(--ink) 42%,transparent);backdrop-filter:blur(3px);padding:1rem;overflow:auto;
}
.overlay.open{display:flex}
.modal{
  background:var(--card-solid);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  width:min(620px,100%);margin:min(6vh,4rem) 0 3rem;padding:1.1rem 1.2rem 1.3rem;
}
.modal h2{font-size:1.6rem}
.modal section{margin-top:1rem}
.modal section > h4{font-size:1.05rem;font-family:'Cormorant Garamond',serif;margin-bottom:.35rem}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button{padding:.35rem .9rem;font-size:.85rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1A1824}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.35rem 0}
.switch{width:44px;height:25px;border-radius:99px;border:1px solid var(--border);background:var(--field);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink-faint);transition:transform .18s,background .18s}
.switch[aria-pressed="true"]{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch[aria-pressed="true"]::after{transform:translateX(19px);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* dice tray */
.tray{
  position:fixed;right:clamp(.6rem,2vw,1.4rem);bottom:1rem;z-index:50;width:min(310px,calc(100vw - 1.6rem));
  background:var(--card-solid);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
}
.tray header{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;border-bottom:1px solid var(--border-soft)}
.tray header h4{font-size:1.05rem}
.tray .log{max-height:min(38vh,300px);overflow:auto;padding:.4rem .75rem .7rem}
.tray.collapsed .log,.tray.collapsed .quick{display:none}
html[data-dice="info"] .quick{display:none}
[data-test]{cursor:pointer}
html[data-dice="disabled"] [data-test]{cursor:default;pointer-events:none;opacity:.65}
.quick{display:flex;gap:.3rem;flex-wrap:wrap;padding:.5rem .75rem;border-top:1px solid var(--border-soft)}
.quick button{font-size:.74rem;border:1px solid var(--border-soft);border-radius:8px;padding:.2rem .5rem;color:var(--ink-soft)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.roll{border-bottom:1px dotted var(--border-soft);padding:.4rem 0;font-size:.84rem}
.roll:last-child{border-bottom:0}
.roll .what{color:var(--ink-soft);font-size:.76rem;display:flex;justify-content:space-between;gap:.5rem}
.roll .total{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;line-height:1.1}
.roll .parts{color:var(--ink-faint);font-size:.74rem}
.plot{font-size:.72rem;letter-spacing:.04em}
.plot.opp{color:var(--ok)}
.plot.comp{color:var(--warn)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:1.2rem;z-index:70;
  background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:999px;font-size:.85rem;
  opacity:0;pointer-events:none;transition:opacity .25s;
  display:flex;align-items:center;gap:.7rem;max-width:min(90vw,26rem);
}
.toast.show{opacity:.95;pointer-events:auto}
#toastaction{
  color:var(--accent-2);font-weight:700;font-size:.8rem;letter-spacing:.03em;text-transform:uppercase;
  flex:0 0 auto;
}
#toastaction:hover{text-decoration:underline}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* radiant ideals */
.ideal{border:1px solid var(--border-soft);border-radius:12px;background:var(--card-solid);padding:.5rem .65rem;margin-bottom:.4rem}
.ideal input{margin-top:.35rem}

/* rules lookup drawer */
.drawer-overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb, var(--ink) 38%, transparent);backdrop-filter:blur(2px)}
.drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:81;width:min(400px,100vw);
  background:var(--card-solid);border-left:1px solid var(--border);box-shadow:-18px 0 40px -20px rgba(0,0,0,.35);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;
}
.drawer.open{transform:translateX(0)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border-bottom:1px solid var(--border-soft)}
.drawer header h4{font-size:1.3rem}
.drawer > input{margin:.7rem 1rem 0;width:calc(100% - 2rem)}
.rulesbody{flex:1;overflow:auto;padding:.6rem 1rem 1.4rem}
.rulesbody h5{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--accent);margin:1rem 0 .3rem;letter-spacing:.03em}
.rulesbody h5:first-child{margin-top:.2rem}
.ruleitem{padding:.4rem 0;border-bottom:1px dotted var(--border-soft)}
.ruleitem b{font-size:.9rem}
.ruleitem p{margin:.15rem 0 0;font-size:.8rem;color:var(--ink-soft)}
.badgecount{
  position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:99px;
  background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;
}
[data-theme="dark"] .badgecount{color:#1A1824}

/* home dashboard */
.vault-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.vaultcard{
  position:relative;border:1px solid var(--border-soft);border-radius:14px;background:var(--card-solid);
  padding:.85rem .95rem;text-align:left;transition:border-color .15s,transform .15s;cursor:pointer;
}
.vaultcard:hover{border-color:var(--accent)}
.vaultcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pinbtn{
  position:absolute;top:.6rem;right:.6rem;font-size:1rem;line-height:1;color:var(--border);
  padding:.15rem;z-index:1;
}
.pinbtn:hover{color:var(--accent-2)}
.pinbtn.on{color:var(--accent-2)}
.joincode{cursor:pointer;border-bottom:1px dashed var(--ink-faint)}
.joincode:hover{color:var(--accent);border-color:var(--accent)}
.vaultcard button{cursor:pointer}
.vaultcard h4{font-size:1.2rem;margin-bottom:.15rem}
.vaultcard .sub{font-size:.78rem;color:var(--ink-faint)}
.vaultcard.newcard{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;
  color:var(--ink-faint);border-style:dashed;min-height:9rem;
}
.vaultcard.newcard:hover{color:var(--accent);border-color:var(--accent)}
.vaultcard.newcard .plus{font-family:'Cormorant Garamond',serif;font-size:2rem;line-height:1}

/* auth screen */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.authcard{
  width:min(400px,100%);background:var(--card-solid);border:1px solid var(--border);border-radius:22px;
  box-shadow:var(--shadow);padding:1.6rem 1.5rem 1.8rem;
}
.authcard details summary{
  list-style:none;cursor:pointer;text-align:center;font-size:.85rem;color:var(--accent);
  padding:.3rem 0;
}
.authcard details summary::-webkit-details-marker{display:none}
.authcard details summary:hover{text-decoration:underline}
.authcard details[open] summary{margin-bottom:.2rem}
.pwwrap{position:relative}
.pwwrap input{padding-right:2.5rem}
.pwtoggle{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);color:var(--ink-faint);padding:.4rem;border-radius:8px}
.pwtoggle:hover{color:var(--accent)}
.pwtoggle.on{color:var(--accent)}

.print-only{display:none}

/* ---------- printed character sheet — matches the official Cosmere RPG sheet layout ---------- */
#printSheet{font-family:'EB Garamond','Cormorant Garamond',serif;color:#111}
#printSheet .sheet-page{width:100%;box-sizing:border-box}
#printSheet .stitle{display:flex;align-items:center;gap:.5rem;border:1.5px solid #111;border-radius:6px;padding:.5rem .8rem;margin-bottom:.4rem}
#printSheet .stitle .glyph{width:2.6rem;height:2.6rem;flex:none}
#printSheet .stitle h1{font-size:1.5rem;letter-spacing:.06em;margin:0;line-height:1.05;text-transform:uppercase}
#printSheet .stitle h2{font-size:.8rem;letter-spacing:.12em;margin:0;font-family:system-ui,sans-serif;color:#333}
#printSheet .stop{display:grid;grid-template-columns:1fr 2.1fr;gap:.4rem;margin-bottom:.4rem}
#printSheet .sidbox{display:grid;grid-template-columns:1fr 1fr}
#printSheet .sbox{border:1.3px solid #111;border-radius:5px;padding:.3rem .55rem;position:relative;min-height:1.6rem}
#printSheet .sbox .lbl{font-family:system-ui,sans-serif;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#333;display:block;margin-bottom:.15rem}
#printSheet .sbox .val{font-size:.92rem}
#printSheet .attrrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.3rem}
#printSheet .attrgroup{text-align:center}
#printSheet .attrgroup > .glabel{font-family:system-ui,sans-serif;font-size:.62rem;letter-spacing:.14em;font-weight:700;text-transform:uppercase;margin-bottom:.2rem}
#printSheet .attrgroup .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.3rem;align-items:end}
#printSheet .attrgroup .abox{border:1.3px solid #111;border-radius:5px;padding:.3rem;text-align:center;min-height:2.6rem}
#printSheet .attrgroup .abox .lbl{font-family:system-ui,sans-serif;font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;display:block}
#printSheet .attrgroup .abox .val{font-size:1.1rem;font-weight:600}
#printSheet .attrgroup .pshield{border:1.3px solid #111;border-radius:0 0 50% 50%/0 0 30% 30%;padding:.3rem;text-align:center;min-height:2.6rem;background:#fff}
#printSheet .attrgroup .pshield .lbl{font-family:system-ui,sans-serif;font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;display:block}
#printSheet .attrgroup .pshield .val{font-size:1.1rem;font-weight:600}
#printSheet .poolrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.3rem}
#printSheet .poolbox{border:1.3px solid #111;border-radius:5px;padding:.3rem .5rem;display:flex;justify-content:space-between;align-items:center}
#printSheet .poolbox .lbl{font-family:system-ui,sans-serif;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
#printSheet .poolbox .val{font-size:1rem}
#printSheet .skillcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.3rem}
#printSheet .skillcol .srow{display:flex;align-items:center;gap:.35rem;font-size:.72rem;padding:.05rem 0;border-bottom:1px solid #ddd}
#printSheet .skillcol .srow .box{width:.7rem;height:.7rem;border:1px solid #111;flex:none}
#printSheet .skillcol .srow .nm{flex:1}
#printSheet .skillcol .srow .pips{letter-spacing:.05em;font-size:.7rem;white-space:nowrap}
#printSheet .rangerow{display:grid;grid-template-columns:1fr 1fr 2fr 2fr;gap:.5rem;margin-bottom:.3rem}
#printSheet .textbox{border:1.3px solid #111;border-radius:5px;padding:.35rem .55rem;margin-bottom:.3rem}
#printSheet .textbox .lbl{font-family:system-ui,sans-serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;display:block;margin-bottom:.2rem}
#printSheet .textbox .body{font-size:.78rem;white-space:pre-wrap;line-height:1.35}
#printSheet .twinrow{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.3rem}
#printSheet .threecol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
#printSheet .item-line{font-size:.76rem;padding:.08rem 0;border-bottom:1px solid #eee}
#printSheet .goal-line{font-size:.76rem;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:.1rem 0}
#printSheet .page-footer{text-align:center;font-family:system-ui,sans-serif;font-size:.6rem;letter-spacing:.08em;color:#666;margin-top:.3rem;text-transform:uppercase}

@media print{
  @page{margin:.35in}
  html,body{background:#fff!important}
  body > *:not(#printSheet){display:none!important}
  .print-only{display:block!important}
  #printSheet .sheet-page{page-break-after:always}
  #printSheet .sheet-page:last-child{page-break-after:auto}
  #printSheet .sbox, #printSheet .abox, #printSheet .shield, #printSheet .poolbox, #printSheet .textbox, #printSheet .stitle{break-inside:avoid}
}
</style>
</head>

<div id="app-main" hidden>

    </svg>

  <button class="pill icon avatarchip" data-action="open-profile" aria-label="Profile" title="Profile" id="profileBtn">

<script>
/* ============================================================
   Radiant Sheet — Cosmere RPG character & party manager
   Single file. No build step. LocalStorage by default,
   optional Firebase sync configured in Settings.
   ============================================================ */

'use strict';

/* ---------- static game data ---------- */
const ATTRS = {
  str:{name:'Strength', short:'STR', realm:'physical'},
  spd:{name:'Speed', short:'SPD', realm:'physical'},
  int:{name:'Intellect', short:'INT', realm:'cognitive'},
  wil:{name:'Willpower', short:'WIL', realm:'cognitive'},
  awa:{name:'Awareness', short:'AWA', realm:'spiritual'},
  pre:{name:'Presence', short:'PRE', realm:'spiritual'}
};

const REALMS = [
  {key:'physical',  name:'Physical',  blurb:'Body, motion, and the world you can touch', attrs:['str','spd'],
   skills:[['agility','Agility','spd'],['athletics','Athletics','str'],['heavyWeapons','Heavy Weapons','str'],
           ['lightWeapons','Light Weapons','spd'],['stealth','Stealth','spd'],['thievery','Thievery','spd']]},
  {key:'cognitive', name:'Cognitive', blurb:'Thought, memory, and learned craft', attrs:['int','wil'],
   skills:[['crafting','Crafting','int'],['deduction','Deduction','int'],['discipline','Discipline','wil'],
           ['intimidation','Intimidation','wil'],['lore','Lore','int'],['medicine','Medicine','int']]},
  {key:'spiritual', name:'Spiritual', blurb:'Connection, instinct, and force of self', attrs:['awa','pre'],
   skills:[['deception','Deception','pre'],['insight','Insight','awa'],['leadership','Leadership','pre'],
           ['perception','Perception','awa'],['persuasion','Persuasion','pre'],['survival','Survival','awa']]}
];
const ALL_SKILLS = REALMS.flatMap(r => r.skills.map(s => ({key:s[0], name:s[1], attr:s[2], realm:r.key})));

const CONDITIONS = ['Afflicted','Determined','Disoriented','Empowered','Enhanced','Exhausted','Focused',
  'Immobilized','Prone','Restrained','Slowed','Stunned','Surprised','Unconscious'];

const EXPERTISES = {

/* Category -> Path -> Specialty -> [talent names], derived from TALENT_DATABASE for the cascading picker */
const TALENT_TREE = Object.entries(TALENT_DATABASE).reduce((tree, [name, t]) => {
  (tree[t.category] = tree[t.category] || {});
  (tree[t.category][t.path] = tree[t.category][t.path] || {});
  (tree[t.category][t.path][t.specialty] = tree[t.category][t.path][t.specialty] || []).push(name);
  return tree;
}, {});

/* ---------- derived values ---------- */
const tierOf = lvl => Math.max(1, Math.min(5, Math.ceil((lvl || 1) / 5)));
const tierSkillRankCap = tier => tier <= 1 ? 2 : tier === 2 ? 3 : tier === 3 ? 4 : 5;

function attrBudgetForLevel(level){
  const lvl = level || 1;
  if (lvl <= 2) return 12;
  if (lvl <= 5) return 13;
  if (lvl <= 8) return 14;
  if (lvl <= 11) return 15;
  if (lvl <= 14) return 16;
  if (lvl <= 17) return 17;
  return 18;
}
const attrCapForLevel = level => (level || 1) <= 2 ? 3 : 5;

function formBonus(c){
  const f = c.singer && SINGER_FORMS[c.form] ? SINGER_FORMS[c.form].bonus : null;
  return f || {};
}

function armorTagsHTML(armor){
  return (armor.tags || []).map(t => `<span class="badge">${esc(t)}</span>`).join(' ');
}

/* ---------- turn speed indicator (Passive / Fast Turn / Slow Turn) ---------- */
const TURN_SPEED_ORDER = ['passive', 'fast', 'slow'];
const TURN_SPEED_LABEL = {passive:'Passive Turn', fast:'Fast Turn', slow:'Slow Turn'};
function turnSpeedIconHTML(mode){
  const n = mode === 'fast' ? 2 : mode === 'slow' ? 3 : 1;
  const step = 7, triW = 13, triH = 16;
  const width = triW + (n - 1) * step;
  let polys = '';
  for (let i = 0; i < n; i++){
    const x = i * step;
    polys += `<polygon points="${x},0 ${x},${triH} ${x + triW},${triH / 2}"/>`;
  }
  return `<svg viewBox="0 0 ${width} ${triH}" width="${width}" height="${Math.round(triH * 0.8)}" aria-hidden="true">${polys}</svg>`;
}
function turnSpeedButtonHTML(c){
  const mode = c.turnSpeed || 'passive';
  return `<button type="button" class="turnspeed turnspeed-${mode}" data-action="cycle-turn-speed"
    aria-label="Turn speed: ${TURN_SPEED_LABEL[mode]}" title="${TURN_SPEED_LABEL[mode]} — click to cycle">${turnSpeedIconHTML(mode)}</button>`;
}

/* A talent counts as "known" if picked in the structured talent picker, or typed
   anywhere in the freeform Talents/Notes text — keeps old freeform sheets working
   with every new automatic rule below. */
function hasTalent(c, name){
  if ((c.talentIds || []).includes(name)) return true;
  const notebookText = (c.notebook || []).map(n => n.title + ' ' + n.text).join(' ');
  const text = (c.talents || '') + ' ' + (c.notes || '') + ' ' + notebookText;
  const re = new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  return re.test(text);
}

function talentExpertiseBonus(c){
  return (c.talentIds || []).reduce((sum, t) => sum + (TALENT_EXPERTISE_BONUS[t] || 0), 0);
}

/* Health Calculation Engine — tier-scaled per-level progression, not a flat multiplier. */
function baseHealthForLevel(level, str){
  let hp = 10 + str;
  const lvl = clamp(level || 1, 1, 99);
  for (let l = 2; l <= lvl; l++){
    if (l <= 5) hp += 5;
    else if (l === 6) hp += 4 + str;
    else if (l <= 10) hp += 4;
    else if (l === 11) hp += 3 + str;
    else if (l <= 15) hp += 3;
    else if (l === 16) hp += 2 + str;
    else if (l <= 20) hp += 2;
    else hp += 1;
  }
  return hp;
}

function resolveArmor(c){
  if (c.armor === 'Custom / Hand-Key' && c.armorHandKey){
    const hk = c.armorHandKey;
    return {name: hk.name || 'Custom armor', deflect: hk.deflect || 0, cumbersome: hk.cumbersome || 0,
            weight: hk.weight || 0, price: hk.price || 0, tags: hk.traits ? [hk.traits] : [], handKey:true};
  }
  return ARMORS.find(x => x.name === c.armor) || ARMORS[0];
}

function derive(c){
  const fb = formBonus(c);
  const a = {}; for (const k in c.attributes) a[k] = c.attributes[k] + (fb[k] | 0);
  const tier = tierOf(c.level);
  const armor = resolveArmor(c);
  const stances = c.stances || {};
  const presentable = (armor.tags || []).includes('Presentable');
  const stancePhys = (stances.customaryGarb && presentable ? 2 : 0) + (stances.vinestance ? 1 : 0) + (stances.bloodstance ? -2 : 0);
  const stanceCog = (stances.collected ? 2 : 0) + (stances.ambitiousMind ? 2 : 0) + (stances.vinestance ? 1 : 0) + (stances.bloodstance ? -2 : 0);
  const stanceSpirit = (stances.collected ? 2 : 0) + (stances.customaryGarb && presentable ? 2 : 0) + (stances.bloodstance ? -2 : 0);

  const d = {
    tier,
    formBonus: fb,
    physicalDefense: 10 + a.str + a.spd + (c.defenseBonus.physical|0) + stancePhys,
    cognitiveDefense: 10 + a.int + a.wil + (c.defenseBonus.cognitive|0) + stanceCog,
    spiritualDefense: 10 + a.awa + a.pre + (c.defenseBonus.spiritual|0) + stanceSpirit,
    lifting: lookup(TABLES.lifting, a.str),
    movement: lookup(TABLES.movement, a.spd),
    recovery: lookup(TABLES.recovery, a.wil),
    senses: lookup(TABLES.senses, a.awa),
    skillRankCap: tierSkillRankCap(tier),
    skills:{}
  };
  d.liftingLbs = parseInt(d.lifting.replace(/[^0-9]/g, ''), 10) || 0;

  d.maxHealth = baseHealthForLevel(c.level, a.str) + (c.health.bonus|0) + (hasTalent(c, 'Hardy') ? c.level : 0);

  const nimbleOrNight = c.singer && (c.form === 'Nimbleform' || c.form === 'Nightform');
  d.maxFocus = 2 + a.wil + (c.focus.bonus|0) + (hasTalent(c, 'Composed') ? tier : 0) + (nimbleOrNight ? 2 : 0);

  d.radiantActive = c.radiant || hasTalent(c, 'First Ideal');
  d.maxInvestiture = d.radiantActive
    ? 2 + Math.max(a.awa, a.pre) + (c.investiture.bonus|0) + (hasTalent(c, 'Invested') ? tier : 0)
    : 0;

  d.armor = armor;
  d.deflect = Math.max(armor.deflect, fb.deflect || 0) + (c.deflectBonus|0);
  const hasArmorExpertise = hasExpertiseNamed(c, armor.name);
  const depleted = armor.name === 'Shardplate' && (c.shardplateCharges|0) <= 0;
  const cumbersomeThreshold = depleted ? (armor.cumbersomeDepleted || 0) : (armor.cumbersome || 0);
  d.cumbersomeWarning = (cumbersomeThreshold && !hasArmorExpertise && a.str < cumbersomeThreshold)
    ? `Cumbersome (Slowed / Disadvantage on Speed tests) — Strength ${a.str} is below the ${armor.name}${depleted ? ' (depleted)' : ''} threshold of ${cumbersomeThreshold}.`
    : '';

  d.expertiseTalentBonus = talentExpertiseBonus(c);
  d.expertiseBaseSlots = 2 + (a.int >= 1 ? a.int : 0);
  d.expertiseSlots = d.expertiseBaseSlots + (c.expertiseBonus|0) + d.expertiseTalentBonus;

  d.gearListWeight = (c.gear || []).reduce((sum, g) => sum + (g.weight||0) * (g.qty||1), 0);
  d.gearListPrice = (c.gear || []).reduce((sum, g) => sum + (g.price||0) * (g.qty||1), 0);
  d.totalCarriedWeight = d.gearListWeight + (c.gearWeight|0);

  d.armorWeight = armor.weight || 0;
  d.weaponsWeight = (c.weapons || []).reduce((sum, w) => {
    const cat = !w.handKey && w.catalogName ? GAME_DATABASE.weapons[w.catalogName] : null;
    return sum + (cat ? (cat.weight || 0) : (w.weight || 0));
  }, 0);
  d.fabrialsWeight = (c.fabrials || []).reduce((sum, f) => sum + (f.weight || 0), 0);
  d.totalGearWeight = Math.round((d.armorWeight + d.weaponsWeight + d.totalCarriedWeight + d.fabrialsWeight) * 100) / 100;
  d.carryingCapacity = lookup(TABLES.carrying, a.str);
  d.overburdened = d.totalGearWeight > d.carryingCapacity;

  ALL_SKILLS.forEach(sk => {
    const s = c.skills[sk.key];
    d.skills[sk.key] = s.ranks + a[sk.attr] + (s.bonus|0);
  });
  REALMS.forEach(r => {
    const s = c.skills['custom_' + r.key];
    d.skills['custom_' + r.key] = s.ranks + (a[s.attr] || 0) + (s.bonus|0);
  });
  return d;
}

/* Cross-references a weapon against known expertises to compute its effective
   (expert-trait-augmented) traits, unless the row was hand-keyed by the player. */
/* Unarmed Attack's base damage die scales with Strength score directly (not skill ranks). */
function unarmedDamageDie(str){
  if (str <= 2) return '1';
  if (str <= 4) return '1d4';
  if (str <= 6) return '1d8';
  if (str <= 8) return '2d6';
  return '2d10';
}

/* Splits a catalog/hand-keyed damage string like "1d4 keen" into {dice:"1d4", type:"keen"}. */
function splitDamageString(raw){
  const m = String(raw || '').trim().match(/^(.*?)\s+(\w+)$/);
  return m ? {dice:m[1], type:m[2]} : {dice:raw || '', type:''};
}

function weaponDisplay(c, d, w){
  const catalog = !w.handKey && w.catalogName ? GAME_DATABASE.weapons[w.catalogName] : null;
  const expertiseName = catalog ? WEAPON_EXPERTISE_NAME[w.catalogName] : null;
  const hasExpertise = expertiseName && hasExpertiseNamed(c, expertiseName);
  let traits = w.traits || '';
  if (catalog && hasExpertise && catalog.expertTraits){
    traits = traits ? `${traits}, ${catalog.expertTraits} (expert)` : `${catalog.expertTraits} (expert)`;
  }
  const isOffhand = /\boffhand\b/i.test(traits);
  const signatureBonus = hasTalent(c, 'Signature Weapon') ? (hasExpertise ? 2 : 1) : 0;

  const effStr = c.attributes.str + (d.formBonus.str || 0);
  let diceExpr, damageType;
  if (w.catalogName === 'Unarmed Attack' && !w.handKey){
    diceExpr = unarmedDamageDie(effStr);
    damageType = 'impact';
  } else {
    const split = splitDamageString(catalog ? catalog.damage : w.damage);
    diceExpr = split.dice;
    damageType = split.type;
  }

  const skillMod = (d.skills[w.skill] || 0) + (w.bonus | 0);
  const exhaustedPenalty = c.conditions.Exhausted ? 1 : 0;
  const attackMod = skillMod - exhaustedPenalty;

  const isRanged = !!(catalog && /ranged/i.test(catalog.range || ''));
  let talentDamageBonus = 0;
  const talentNotes = [];
  if (hasTalent(c, 'Mighty')){
    const bonus = 1 + d.tier; // assumes a single standard Strike action (1 action point spent)
    talentDamageBonus += bonus;
    talentNotes.push(`Mighty +${bonus}`);
  }
  if (isRanged && hasTalent(c, 'Steady Aim')){
    const bonus = c.skills.perception.ranks || 0;
    if (bonus){ talentDamageBonus += bonus; talentNotes.push(`Steady Aim +${bonus}`); }
  }
  const totalDamageMod = skillMod + talentDamageBonus;

  const cumbersomeMatch = traits.match(/Cumbersome\s*\[(\d+)\]/i);
  const weaponCumbersome = !!(cumbersomeMatch && effStr < parseInt(cumbersomeMatch[1], 10));
  const disadvantage = weaponCumbersome || !!d.cumbersomeWarning || !!c.conditions.Disoriented;

  return {catalog, expertiseName, hasExpertise, traits, isOffhand,
          offhandFocusCost: isOffhand ? 1 : 2, signatureBonus,
          diceExpr, damageType, skillMod, exhaustedPenalty, attackMod,
          talentDamageBonus, talentNotes, totalDamageMod, disadvantage};
}

const state = {

function activeChar(){
  return state.characters.find(c => c.id === state.activeId) || state.characters[0] || null;

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      Object.assign(state, parsed, {settings:{...state.settings, ...(parsed.settings||{})}, rolls: parsed.rolls || []});
    }
  } catch(err){ console.warn('Could not read saved data', err); }
  if (state.characters.length && !state.characters.some(c => c.id === state.activeId)) state.activeId = state.characters[0].id;
  if (!state.characters.length) state.activeId = null;
  state.characters.forEach(migrate);
  (state.localParties || []).forEach(p => {
    if (!p.code) p.code = genCode();
    if (p.gmName === undefined) p.gmName = state.profile.username || 'You';
    if (p.sessionDate === undefined) p.sessionDate = '';
  });
}

function migrate(c){
  const fresh = newCharacter();
  if (c.notebook === undefined && c.notes){
    c.notebook = [{id:uid(), title:'Notes', text:c.notes, updatedAt:Date.now()}];
  }
  for (const k in fresh) if (c[k] === undefined) c[k] = fresh[k];
  if (!Array.isArray(c.notebook)) c.notebook = [];
  for (const k in fresh.skills) if (!c.skills[k]) c.skills[k] = fresh.skills[k];
  c.goals = c.goals && c.goals.length ? c.goals : [{text:'', ticks:[false,false,false]}];
  if (typeof c.spheres === 'string') c.spheres = {chips:0, marks:0, broams:0, notes:c.spheres};
  if (!c.spheres || typeof c.spheres !== 'object') c.spheres = fresh.spheres;
  if (!c.spren || typeof c.spren !== 'object') c.spren = fresh.spren;
  c.spren.ideals = (c.spren.ideals && c.spren.ideals.length === IDEAL_NAMES.length) ? c.spren.ideals : fresh.spren.ideals;
  if (!Array.isArray(c.squires)) c.squires = [];
  if (!Array.isArray(c.fabrials)) c.fabrials = [];
  if (!SINGER_FORMS[c.form]) c.form = fresh.form;
  c.expertises = (c.expertises || []).map(e => typeof e === 'string' ? {name:e, temporary:false} : e);
}

function hasExpertiseNamed(c, name){
  return (c.expertises || []).some(e => e.name === name);
}

let saveTimer = null, saveState = 'saved';
function persistLocal(){
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      characters:state.characters, activeId:state.activeId, settings:state.settings,
      profile:state.profile, localParties:state.localParties, rolls:state.rolls.slice(0,30),
      session:state.session, tab:state.tab
    }));
    setSavePill('saved');
  } catch(err){
    setSavePill('error');
    toast('Browser storage is full — export a backup file.');
  }
}
function save(){
  setSavePill('saving');
  const ac = activeChar();
  if (ac) ac.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    persistLocal();
    cloud.pushCharacter();
    cloud.syncCharactersUp();
  }, 250);
}
function setSavePill(mode){
  saveState = mode;
  const pill = document.getElementById('savepill');
  const text = document.getElementById('savetext');
  if (!pill) return;
  pill.classList.toggle('saved', mode === 'saved');
  pill.querySelector('.dot').classList.toggle('pending', mode !== 'saved');
  const cloudReady = cloud.on && cloud.user;
  text.textContent = mode === 'saved' ? (cloudReady ? 'Synced' : (cloud.on ? 'Saved' : 'Saved offline')) : mode === 'saving' ? 'Saving' : 'Not saved';
  if (mode === 'saved' && cloudReady) markSynced();
  updateSyncIndicator();
}

let lastSyncAt = null;
function markSynced(){ lastSyncAt = Date.now(); }
function updateSyncIndicator(){
  const el = document.getElementById('synctime');
  if (!el) return;
  if (!(cloud.on && cloud.user) || !lastSyncAt || saveState !== 'saved'){ el.textContent = ''; return; }
  const secs = Math.round((Date.now() - lastSyncAt) / 1000);
  el.textContent = '· ' + (secs < 3 ? 'just now' : secs < 60 ? `${secs}s ago` : `${Math.round(secs / 60)}m ago`);
}
setInterval(updateSyncIndicator, 5000);

/* ---------- tiny helpers ---------- */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

/* Rebuilding a card's innerHTML can shift the page's total scrollable height
   (a warning line appearing/disappearing, content-visibility re-estimating
   off-screen cards, etc.), which makes the browser clamp/jump the scroll
   position. Re-render through here to land back where the user actually was. */
function preserveScroll(fn){
  const y = window.scrollY;
  fn();
  if (window.scrollY !== y) window.scrollTo(0, y);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const sgn = n => (n >= 0 ? '+' : '') + n;
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

let toastTimer;
function toast(msg, duration){
  const t = $('#toast');
  $('#toasttext').textContent = msg;
  $('#toastaction').hidden = true;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration || 2600);
}

function showUndoToast(msg, onUndo, duration){
  const t = $('#toast');
  const btn = $('#toastaction');
  $('#toasttext').textContent = msg;
  btn.textContent = 'Undo';
  btn.hidden = false;
  btn.onclick = () => { t.classList.remove('show'); clearTimeout(toastTimer); onUndo(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); btn.hidden = true; }, duration || 6000);
}

function getPath(obj, path){
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setPath(obj, path, value){
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}

/* ---------- talent prerequisite checker (heuristic — informs, never blocks; GM overrides always allowed) ---------- */
function checkPrereq(c, reqText){
  if (!reqText || /^none/i.test(reqText.trim())) return {met:true};
  const lvlMatch = reqText.match(/Level\s+(\d+)\+/i);
  if (lvlMatch && c.level < parseInt(lvlMatch[1], 10)){
    return {met:false, reason:`Requires Level ${lvlMatch[1]}+ (currently ${c.level}).`};
  }
  for (const sk of ALL_SKILLS){
    const m = reqText.match(new RegExp('\\b' + sk.name + '\\s+(\\d+)\\+', 'i'));
    if (m){
      const need = parseInt(m[1], 10), have = c.skills[sk.key].ranks;
      if (have < need) return {met:false, reason:`Requires ${sk.name} rank ${need}+ (currently ${have}).`};
    }
  }
  const keyRefs = [...reqText.matchAll(/\b([A-Z][A-Za-z ]*?)\s+Key\b/g)].map(m => m[1]);
  const namedTalents = Object.keys(TALENT_DATABASE).filter(n => reqText.includes(n));
  const candidates = [...new Set([...keyRefs, ...namedTalents])];
  if (candidates.length && !candidates.some(t => hasTalent(c, t))){
    return {met:false, reason:`Requires ${candidates[0]} (not yet known).`};
  }
  return {met:true};
}

function updatePointsSpent(){
  const line = $('#pointsline');
  if (!line) return;
  const c = activeChar();
  const budget = attrBudgetForLevel(c.level);
  const baseCap = attrCapForLevel(c.level);
  const fb = formBonus(c);
  const spent = Object.values(c.attributes).reduce((a, b) => a + b, 0);
  const over = Object.entries(c.attributes)
    .filter(([k, v]) => v > baseCap + Math.max(0, fb[k] || 0))
    .map(([k]) => ATTRS[k].short);
  line.textContent = `${spent} of ${budget} attribute points spent`
    + (spent > budget ? ` — over the level ${c.level} budget` : '')
    + (over.length ? `. Attribute cap at this level is ${baseCap}${Object.keys(fb).length ? ' (higher where a Singer Form bonus applies)' : ''}: ${over.join(', ')} ${over.length > 1 ? 'are' : 'is'} above it.` : '.');
  line.style.color = (spent > budget || over.length) ? 'var(--warn)' : '';
}

/* ============================================================
   LIVE VALUE SYNC — updates computed nodes without rebuilding
   ============================================================ */
function syncDerived(){
  const c = activeChar();
  const badge = $('#tierbadge');
  if (!c){ if (badge) badge.textContent = 'No character'; return; }
  const d = derive(c);
  const set = (key, val) => $$(`[data-derived="${key}"]`).forEach(n => { if (n.textContent !== String(val)) n.textContent = val; });

  ['physicalDefense','cognitiveDefense','spiritualDefense','lifting','movement','recovery','senses','deflect'].forEach(k => set(k, d[k]));
  set('shardplateCharges', c.shardplateCharges);
  Object.keys(ATTRS).forEach(k => set('attr.' + k, c.attributes[k]));
  Object.keys(d.skills).forEach(k => set('skill.' + k, sgn(d.skills[k])));
  set('maxhealth', d.maxHealth); set('maxfocus', d.maxFocus); set('maxinvestiture', d.maxInvestiture);
  const expSummary = $('#expertiseSummary');
  if (expSummary) expSummary.textContent = expertiseSummaryText(c, d);

  [['health', d.maxHealth], ['focus', d.maxFocus], ['investiture', d.maxInvestiture]].forEach(([k, max]) => {
    const bar = $(`[data-derived="bar${k}"]`);
    if (bar) bar.style.width = (max > 0 ? clamp(c[k].current / max * 100, 0, 100) : 0) + '%';
  });

  if (badge) badge.textContent = `Level ${c.level} · Tier ${d.tier}`;

  const tags = $('#armortags');
  if (tags){
    tags.innerHTML = armorTagsHTML(d.armor);
    tags.style.display = d.armor.tags && d.armor.tags.length ? '' : 'none';
  }
  const cumb = $('#cumbersomeline');
  if (cumb){
    cumb.textContent = d.cumbersomeWarning;
    cumb.style.display = d.cumbersomeWarning ? '' : 'none';
  }
}

/* ============================================================
   DICE
   ============================================================ */
function rollDie(sides){ return 1 + Math.floor(Math.random() * sides); }

function parseDice(expr){
  // returns {total, detail} for expressions like "2d6 + 3"
  let total = 0, parts = [];
  const tokens = String(expr).replace(/\s+/g, '').match(/[+-]?[^+-]+/g) || [];
  tokens.forEach(tok => {
    const sign = tok.startsWith('-') ? -1 : 1;
    const body = tok.replace(/^[+-]/, '');
    const m = body.match(/^(\d*)d(\d+)$/i);
    if (m){
      const n = parseInt(m[1] || '1', 10), s = parseInt(m[2], 10);
      const rolls = Array.from({length:clamp(n, 1, 50)}, () => rollDie(s));
      total += sign * rolls.reduce((a, b) => a + b, 0);
      parts.push(`${sign < 0 ? '−' : ''}${n}d${s} [${rolls.join(', ')}]`);
    } else if (/^\d+$/.test(body)){
      total += sign * parseInt(body, 10);
      parts.push(`${sign < 0 ? '−' : '+'}${body}`);
    } else if (body){
      parts.push(body); // free text like STR — left for the player to add
    }
  });
  return {total, detail:parts.join(' ')};
}

function expandAttrs(expr, c){
  return String(expr).replace(/\b(STR|SPD|INT|WIL|AWA|PRE)\b/gi, m => String(c.attributes[m.toLowerCase()]));
}

/* Maximum possible value of a dice expression like "2d6+3" — used for Critical Hit. */
function maxDiceValue(expr){
  let total = 0;
  const tokens = String(expr).replace(/\s+/g, '').match(/[+-]?[^+-]+/g) || [];
  tokens.forEach(tok => {
    const sign = tok.startsWith('-') ? -1 : 1;
    const body = tok.replace(/^[+-]/, '');
    const m = body.match(/^(\d*)d(\d+)$/i);
    if (m) total += sign * (parseInt(m[1] || '1', 10) * parseInt(m[2], 10));
    else if (/^\d+$/.test(body)) total += sign * parseInt(body, 10);
  });
  return total;
}

function plotDie(){
  const v = rollDie(6);
  return {value:v, label: v <= 2 ? 'Complication' : v <= 4 ? 'Blank' : 'Opportunity',
          cls: v <= 2 ? 'comp' : v <= 4 ? '' : 'opp'};
}

function logRoll(entry){
  entry.at = Date.now();
  state.rolls.unshift(entry);
  state.rolls = state.rolls.slice(0, 30);
  $('#tray').classList.remove('collapsed');
  $('#traytoggle').textContent = 'Hide';
  renderRolls();
  save();
}

function renderRolls(){
  const log = $('#rolllog');
  if (!log) return;
  if (!state.rolls.length){ log.innerHTML = '<p class="empty">Rolls appear here. Tap any skill modifier to test it.</p>'; return; }
  log.innerHTML = state.rolls.map(r => `<div class="roll">
    <div class="what"><span>${esc(r.what)}</span><span>${new Date(r.at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>
    <div class="total">${esc(r.total)}</div>
    <div class="parts">${esc(r.detail)}</div>
    ${r.plot ? `<div class="plot ${r.plot.cls}">Plot die ${r.plot.value} — ${r.plot.label}</div>` : ''}
  </div>`).join('');
}

function rollTest(label, modifier){
  const mode = state.settings.diceMode;
  if (mode === 'disabled') return;
  if (mode === 'info'){
    logRoll({
      what: label,
      total: `1d20 ${sgn(modifier)}`,
      detail: `Roll a d20 and add ${sgn(modifier)}.${state.settings.plotDie ? ' Also roll a d6 plot die.' : ''}`
    });
    return;
  }
  const die = rollDie(20);
  const entry = {
    what: label,
    total: String(die + modifier),
    detail: `d20 [${die}] ${sgn(modifier)}${die === 20 ? ' — natural 20' : die === 1 ? ' — natural 1' : ''}`
  };
  if (state.settings.plotDie) entry.plot = plotDie();
  logRoll(entry);
}

function rollWeaponAction(i, kind){
  const mode = state.settings.diceMode;
  if (mode === 'disabled') return;
  const c = activeChar(), d = derive(c), w = c.weapons[i];
  if (!w) return;
  const disp = weaponDisplay(c, d, w);
  const diceExpr = expandAttrs(disp.diceExpr || '1d6', c);
  const weaponName = w.name || w.catalogName || 'Weapon';
  const kindLabel = kind === 'graze' ? 'Graze' : kind === 'crit' ? 'Critical Hit' : 'Hit';
  const what = `${weaponName} — ${kindLabel}`;

  if (kind === 'graze'){
    if (mode === 'info'){
      logRoll({what, total:diceExpr, detail:`Roll ${diceExpr} ${disp.damageType} damage (a graze does not add the skill modifier).`});
      return;
    }
    const dmg = parseDice(diceExpr);
    logRoll({what, total:`${dmg.total} damage`, detail:`${dmg.detail} ${disp.damageType}`});
    return;
  }

  if (kind === 'crit'){
    const maxDmg = maxDiceValue(diceExpr) + disp.totalDamageMod;
    logRoll({what, total:`${maxDmg} damage`, detail:`Max ${diceExpr} ${sgn(disp.totalDamageMod)} ${disp.damageType} (critical hits maximize the dice).`});
    return;
  }

  // kind === 'hit'
  if (mode === 'info'){
    logRoll({
      what,
      total: `1d20 ${sgn(disp.attackMod)} to hit`,
      detail: `Roll 1d20 ${sgn(disp.attackMod)} vs ${w.defense}${disp.disadvantage ? ' with Disadvantage' : ''}. On a hit, roll ${diceExpr} ${sgn(disp.totalDamageMod)} ${disp.damageType} damage.${state.settings.plotDie ? ' Also roll a d6 plot die.' : ''}`
    });
    return;
  }
  const die = rollDie(20);
  const dmg = parseDice(diceExpr);
  const entry = {
    what,
    total: `${die + disp.attackMod} to hit vs ${w.defense} · ${dmg.total + disp.totalDamageMod} damage`,
    detail: `d20 [${die}] ${sgn(disp.attackMod)}${disp.disadvantage ? ' (Disadvantage)' : ''} · damage ${dmg.detail} ${sgn(disp.totalDamageMod)} ${disp.damageType}`
  };
  if (state.settings.plotDie) entry.plot = plotDie();
  logRoll(entry);
}

/* ---------- rests ---------- */
function shortRest(){
  const c = activeChar();
  if (!c){ toast('Create a character first.'); return; }
  const d = derive(c);
  const die = parseInt(d.recovery.slice(1), 10);
  const roll = rollDie(die) + c.attributes.wil;
  c.health.current = clamp(c.health.current + roll, 0, d.maxHealth);
  c.focus.current = d.maxFocus;
  logRoll({what:`${c.name} takes a short rest`, total:`+${roll} health`,
           detail:`Recovery ${d.recovery} + WIL, focus restored to ${d.maxFocus}`});
  render();
  save();
  toast(`Recovered ${roll} health. Focus is full.`);
}

function longRest(){
  const c = activeChar();
  if (!c){ toast('Create a character first.'); return; }
  const d = derive(c);
  c.health.current = d.maxHealth;
  c.focus.current = d.maxFocus;
  if (c.radiant) c.investiture.current = d.maxInvestiture;
  c.injuries.forEach(inj => inj.days = Math.max(0, (inj.days | 0) - 1));
  c.injuries = c.injuries.filter(inj => inj.days > 0 || !inj.text);
  ['Exhausted','Disoriented','Slowed','Stunned','Surprised','Prone'].forEach(k => delete c.conditions[k]);
  render();
  save();
  toast('Long rest complete. Pools are full and injuries advanced a day.');
}

/* ============================================================
   EXPERTISE COMBOBOX
   ============================================================ */
function bindCombo(){
  const input = $('#expinput'), menu = $('#expmenu');
  if (!input) return;
  let hl = -1, items = [];

  const flat = () => {
    const out = [];
    for (const g in EXPERTISES) EXPERTISES[g].forEach(n => out.push({name:n, group:g}));
    return out;
  };

  const open = () => {
    const q = input.value.trim().toLowerCase();
    const c = activeChar();
    const matches = flat().filter(x => !hasExpertiseNamed(c, x.name) && (!q || x.name.toLowerCase().includes(q)));
    items = matches.slice(0, 40);
    let html = '', lastGroup = '';
    items.forEach((x, i) => {
      if (x.group !== lastGroup){ html += `<div class="grp">${x.group}</div>`; lastGroup = x.group; }
      html += `<button data-exp="${esc(x.name)}" class="${i === hl ? 'hl' : ''}">${esc(x.name)}</button>`;
    });
    if (q && !flat().some(x => x.name.toLowerCase() === q))
      html = `<div class="grp">Custom</div><button data-exp="${esc(input.value.trim())}">Add “${esc(input.value.trim())}”</button>` + html;
    menu.innerHTML = html || '<div class="grp">Nothing left to add</div>';
    menu.hidden = false;
  };

  const close = () => { menu.hidden = true; hl = -1; };

  input.addEventListener('focus', open);
  input.addEventListener('input', () => { hl = -1; open(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      hl = clamp(hl + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1);
      open();
    } else if (e.key === 'Enter'){
      e.preventDefault();
      const pick = hl >= 0 && items[hl] ? items[hl].name : input.value.trim();
      if (pick) addExpertise(pick);
    } else if (e.key === 'Escape') close();
  });
  menu.addEventListener('mousedown', e => {
    const btn = e.target.closest('[data-exp]');
    if (btn){ e.preventDefault(); addExpertise(btn.dataset.exp); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
}

function addExpertise(name){
  const c = activeChar();
  name = name.trim();
  if (!name) return;
  if (hasExpertiseNamed(c, name)){ toast(`${name} is already on the sheet.`); return; }
  c.expertises.push({name, temporary:false});
  save();
  renderFront();
  syncDerived();
  const input = $('#expinput');
  if (input){ input.value = ''; input.focus(); }
}

document.addEventListener('input', e => {
  const t = e.target;
  const path = t.dataset.path;
  if (path === undefined) return;
  const c = activeChar();
  let value = t.value;
  if (t.type === 'number'){
    value = t.value === '' ? 0 : parseInt(t.value, 10);
    if (Number.isNaN(value)) value = 0;
    if (path === 'level') value = clamp(value, 1, 20);
  }
  setPath(c, path, value);
  if (t.dataset.clamp){
    const d = derive(c);
    const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[t.dataset.clamp];
    const fixed = clamp(value, 0, max);
    if (fixed !== value){ setPath(c, path, fixed); t.value = fixed; }
  }
  if (path === 'level') updatePointsSpent();
  if (path === 'armor'){
    if (value === 'Custom / Hand-Key' && !c.armorHandKey) c.armorHandKey = {name:'', deflect:0, cumbersome:0, weight:0, price:0, traits:''};
    renderFront();
  }
  if (t.dataset.renames){ renderCharPicker(); updateTabTitle(); }
  if (path.startsWith('spheres.') && path !== 'spheres.notes'){
    const el = $('#sphereTotal');
    if (el) el.textContent = sphereTotalText(c);
  }
  if (path === 'gearWeight' || path.startsWith('gear.') || path.startsWith('fabrials.')){
    const d = derive(c);
    const line = $('#weightline');
    if (line){
      line.textContent = weightLineText(c, d);
      line.style.color = d.totalCarriedWeight > d.liftingLbs ? 'var(--warn)' : '';
    }
    const overLine = $('#overburdenedline');
    if (overLine) overLine.outerHTML = overburdenedBadgeHTML(d);
  }
  syncDerived();
  save();
});

document.addEventListener('click', e => {
  const c = activeChar();

  const tab = e.target.closest('.tab');
  if (tab) return switchTab(tab.dataset.tab);

  const pip = e.target.closest('[data-pips] i');
  if (pip){
    const group = pip.parentElement;
    const path = group.dataset.pips;
    const rank = parseInt(pip.dataset.rank, 10);
    const current = getPath(c, path);
    const next = current === rank ? rank - 1 : rank;
    setPath(c, path, next);
    Array.from(group.children).forEach(i => i.classList.toggle('on', parseInt(i.dataset.rank, 10) <= next));
    syncDerived(); save();
    return;
  }

  const tick = e.target.closest('[data-ticks] i');
  if (tick){
    const gi = parseInt(tick.parentElement.dataset.ticks, 10);
    const ti = parseInt(tick.dataset.t, 10);
    c.goals[gi].ticks[ti] = !c.goals[gi].ticks[ti];
    tick.classList.toggle('on', c.goals[gi].ticks[ti]);
    save();
    return;
  }

  const idealTick = e.target.closest('[data-idealticks] i');
  if (idealTick){
    const ii = parseInt(idealTick.parentElement.dataset.idealticks, 10);
    const ti = parseInt(idealTick.dataset.t, 10);
    const ideal = c.spren.ideals[ii];
    ideal.ticks[ti] = !ideal.ticks[ti];
    idealTick.classList.toggle('on', ideal.ticks[ti]);
    save();
    return;
  }

  const attrBtn = e.target.closest('[data-attr]');
  if (attrBtn){
    const k = attrBtn.dataset.attr;
    c.attributes[k] = clamp(c.attributes[k] + parseInt(attrBtn.dataset.by, 10), 0, 9);
    const d = derive(c);
    ['health','focus','investiture'].forEach(kind => {
      const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[kind];
      c[kind].current = clamp(c[kind].current, 0, max);
      const field = $(`[data-path="${kind}.current"]`);
      if (field) field.value = c[kind].current;
    });
    syncDerived(); updatePointsSpent(); save();
    return;
  }

  const adj = e.target.closest('[data-adjust]');
  if (adj){
    const kind = adj.dataset.adjust, by = parseInt(adj.dataset.by, 10);
    if (kind === 'shardplateCharges'){
      c.shardplateCharges = clamp((c.shardplateCharges|0) + by, 0, 4);
      syncDerived(); save();
      return;
    }
    const d = derive(c);
    const max = {health:d.maxHealth, focus:d.maxFocus, investiture:d.maxInvestiture}[kind];
    c[kind].current = clamp(c[kind].current + by, 0, max);
    const field = $(`[data-path="${kind}.current"]`);
    if (field) field.value = c[kind].current;
    syncDerived(); save();
    return;
  }

  const cond = e.target.closest('[data-cond]');
  if (cond && !cond.dataset.action){
    const n = cond.dataset.cond;
    c.conditions[n] = !c.conditions[n];
    if (!c.conditions[n]) delete c.conditions[n];
    cond.setAttribute('aria-pressed', String(!!c.conditions[n]));
    save();
    return;
  }

  const toggle = e.target.closest('[data-toggle]');
  if (toggle){
    const k = toggle.dataset.toggle;
    const next = !getPath(c, k);
    setPath(c, k, next);
    toggle.setAttribute('aria-pressed', String(next));
    if (k === 'radiant' && next) c.investiture.current = derive(c).maxInvestiture;
    renderFront(); syncDerived(); save();
    return;
  }

  const test = e.target.closest('[data-test]');
  if (test){
    if (state.settings.diceMode === 'disabled') return;
    const key = test.dataset.test;
    if (key === 'recovery'){
      const d = derive(c);
      if (state.settings.diceMode === 'info'){
        logRoll({what:`${c.name} — recovery die`, total:`${d.recovery} ${sgn(c.attributes.wil)}`, detail:`Roll ${d.recovery} and add WIL ${sgn(c.attributes.wil)}.`});
        return;
      }
      const die = parseInt(d.recovery.slice(1), 10);
      const r = rollDie(die);
      logRoll({what:`${c.name} — recovery die`, total:String(r + c.attributes.wil), detail:`${d.recovery} [${r}] + WIL ${sgn(c.attributes.wil)}`});
    } else {
      const d = derive(c);
      const sk = ALL_SKILLS.find(s => s.key === key);
      const label = sk ? sk.name : (c.skills[key].name || 'Custom skill');
      rollTest(`${c.name} — ${label}`, d.skills[key]);
    }
    return;
  }

  const roll = e.target.closest('[data-roll]');
  if (roll){
    if (state.settings.diceMode !== 'enabled') return;
    const res = parseDice(roll.dataset.roll);
    const entry = {what:`Quick roll — ${roll.dataset.roll}`, total:String(res.total), detail:res.detail};
    if (state.settings.plotDie && roll.dataset.roll === '1d20') entry.plot = plotDie();
    logRoll(entry);
    return;
  }

  const act = e.target.closest('[data-action]');
  if (act) handleAction(act.dataset.action, act, c);
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit-action]');

document.addEventListener('keydown', e => {
